name: owt-backup

# ==============================================================================
# Backup contour, REPLICA (home server). Unused on Moscow — dumps go to Timeweb S3.
#
# rustfs here is the bucket-replication target from dd-new. Caddy sits next to
# it only so the public endpoint has valid TLS: rustfs can do TLS itself
# (RUSTFS_TLS_PATH), but then certs would need a separate ACME client.
# Caddy does ACME; the config is four lines.
#
#   cd ops/backup
#   docker compose -f compose.home.yml --env-file backup.env up -d
#
# External requirements: A record for $HOME_S3_DOMAIN at the home IP, ports
# 80 and 443 forwarded. 80 is only for ACME (HTTP-01) and the redirect.
#
# Firewall: allow 443 ONLY from the prod IP (plus your own address for
# restores) — the replica is not a public service:
#   ufw allow from <prod-ip> to any port 443 proto tcp
# Keep 80 open for ACME until the first certificate is issued.
# ==============================================================================

services:
  rustfs:
    image: ${RUSTFS_IMAGE:?set RUSTFS_IMAGE in backup.env}
    restart: unless-stopped
    # No published ports: outside traffic goes through caddy only.
    # Console off (the image starts it with CORS `*`); for debugging set
    # RUSTFS_CONSOLE_ENABLE=true and forward 9001 over ssh.
    expose:
      - "9000"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${HOME_RUSTFS_ROOT_USER:?}
      RUSTFS_SECRET_KEY: ${HOME_RUSTFS_ROOT_PASSWORD:?}
      # See docker-compose.backup.yml: without the second variable a new
      # bucket is created in relaxed mode and does not fsync metadata.
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_NEW_BUCKET_DURABILITY_MODE: strict
    volumes:
      # Host dirs owned by 10001:10001 (see docs/backup-rustfs.md).
      - ${HOME_RUSTFS_DATA_DIR:?}:/data
      - ${HOME_RUSTFS_LOG_DIR:?}:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backup

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOME_S3_DOMAIN: ${HOME_S3_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy volumes hold the ACME account and issued certs. Losing them
      # means a new issue (and a Let's Encrypt rate-limit risk), so not tmpfs.
      - ${HOME_CADDY_DATA_DIR:?}/data:/data
      - ${HOME_CADDY_DATA_DIR:?}/config:/config
    depends_on:
      - rustfs
    networks:
      - backup

networks:
  backup:
    driver: bridge
