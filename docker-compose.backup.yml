name: owt-backup

# ==============================================================================
# Optional local rustfs. Production dumps go to Timeweb S3
# (ops/backup/backup.sh, docs/backup-rustfs.md) — this compose is not required.
#
# Separate project, not a service in docker-compose.production.yml: `make prod-down`
# must not take down the store if it is still used as an endpoint.
#
# Ports on loopback: Docker-published ports bypass ufw on this host.
# This S3 is not needed from outside.
#
#   docker compose -f docker-compose.backup.yml --env-file ops/backup/backup.env up -d
# ==============================================================================

services:
  rustfs:
    image: ${RUSTFS_IMAGE:?set RUSTFS_IMAGE in ops/backup/backup.env}
    restart: unless-stopped
    # Console off: management goes through mc (ops/backup/*.sh), and the image
    # starts the console with RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*.
    # Enable for debugging: RUSTFS_CONSOLE_ENABLE=true + ssh -L 9001.
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # One directory = a single disk, ZERO parity (rustfs: 1 disk -> 0 parity).
      # Bitrot is detected but not repaired — the only recovery path is another
      # copy. Local EC on one physical disk does not survive host loss either.
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?}
      # Both required: process default is strict, but NEW buckets are created
      # in relaxed mode, where xl.meta and inline objects are not fsynced —
      # on power loss an acknowledged write can end up without metadata.
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_NEW_BUCKET_DURABILITY_MODE: strict
    volumes:
      # Bind-mount, not a named volume: backups should sit on a chosen (large)
      # partition, not in /var/lib/docker. Cost is a manual chown: the container
      # runs as uid:gid 10001:10001 (see docs/backup-rustfs.md).
      - ${RUSTFS_DATA_DIR:?}:/data
      - ${RUSTFS_LOG_DIR:?}:/logs
    healthcheck:
      # /health needs no signature and is on by default; curl is in the image.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.05'
          memory: 128M
