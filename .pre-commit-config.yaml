# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Install once: `cd backend && uv run pre-commit install` (installs both hook types below).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        stages: [pre-commit]  # its manifest also opts into push; a push hook must not rewrite files
        exclude: |
            (?x)^(
                frontend/src/client/.*|
                backend/app/email-templates/build/.*
            )$
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^frontend/src/client/.*
  # ruff comes from backend/uv.lock, the same binary CI's lint-backend job runs,
  # so a local hook and CI can never disagree on version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix (staged)
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: ruff-format
        name: ruff format (staged)
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
      # Push gate = CI gate (backend/scripts/lint.sh), whole workspace.
      - id: ruff-check-all
        name: ruff check (backend)
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
      - id: ruff-format-check-all
        name: ruff format --check (backend)
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]

ci:
  autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
  autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
