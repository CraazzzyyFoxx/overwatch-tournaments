# SonarCloud analysis scope for anak-tournaments (backend/ Python, frontend/ Next.js+TS, gateway/ Go).
#
# Two goals:
#   1. Keep non-source artifacts out of the analysis, so issues raised are actually actionable.
#   2. Classify test code as tests, so test-only patterns are not judged by production rules.

# --- Excluded from analysis -------------------------------------------------
#
# frontend/public/**
#   Static, published assets — not maintained source. Notably
#   frontend/public/docs/design-book.html is a generated documentation artifact;
#   Sonar reported Web:InputWithoutLabelCheck against it, which cannot be fixed
#   in the file because the file is output, not input.
#
# backend/migrations/versions/**
#   Alembic revisions are immutable historical records: once applied, they are
#   never refactored, because editing them rewrites migration history and breaks
#   the revision chain for every existing database. Sonar raises dozens of
#   python:S1192 (duplicated string literals) here that are physically
#   unfixable, drowning out real findings.
#
# backend/docs/schema.sql, backend/docs/schema.dbml
#   Generated by scripts/export_db_schema.py from backend/shared/models. Sonar
#   parses the DDL as PL/SQL and raises BLOCKER plsql:SizeConstraintMissingCheck
#   on every unbounded VARCHAR — valid, deliberate PostgreSQL, and unfixable in
#   a file that is output. Two of them dropped New Code to Reliability E.
#
# node_modules, .venv — third-party dependency code; not ours to fix.
# __pycache__, .mypy_cache, .pytest_cache, .ruff_cache — tool caches.
# dist, build, .next — compiled/generated output; fix the source instead.
sonar.exclusions=frontend/public/**,**/node_modules/**,**/.venv/**,**/__pycache__/**,**/.mypy_cache/**,**/.pytest_cache/**,**/.ruff_cache/**,**/dist/**,**/build/**,**/.next/**,backend/migrations/versions/**,backend/docs/schema.sql,backend/docs/schema.dbml

# --- Classified as test code ------------------------------------------------
#
# Analyzed, but under test-appropriate rules: assertions, fixtures and
# deliberate duplication in tests are intentional, not defects.
# Covers all three stacks: pytest (test_*.py), Vitest (*.test.ts/tsx), Go (*_test.go).
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*_test.go

# --- Suppressed rule: typescript:S6478 --------------------------------------
#
# NOT configurable here. Automatic Analysis reads only a small subset of
# properties from this file, and `sonar.issue.ignore.multicriteria` is not one
# of them, so the suppression lives as a PROJECT SETTING on SonarCloud
# (Administration > General Settings > Analysis Scope > Issues):
#
#   sonar.issue.ignore.multicriteria = [ ruleKey=typescript:S6478,
#                                        resourceKey=**/* ]
#
# It is recorded here because a setting that exists only in a web UI is a
# setting nobody finds when they wonder why a rule went quiet.
#
# Why: "React components should not be nested" produced 155 findings and every
# single one was a false positive, because the shapes it matches are mandated
# library APIs, not nested component definitions:
#   132  TanStack Table ColumnDef `cell` / `header` callbacks
#    19  next-intl `t.rich` chunk formatters, e.g. em: (chunks) => <em>{chunks}</em>
#     2  a recharts `formatter` and an Array.from map callback
#     2  shadcn's vendored calendar.tsx `components={{ Root, Chevron }}`
# Hoisting any of them means fighting the library. Closing them one by one was
# rejected: each new column definition or rich-text message raises the finding
# again, so the backlog regrows on its own.
#
# A rule was suppressed rather than the quality profile replaced on purpose.
# The `ts` profile is the built-in "Sonar way": it cannot be edited, an
# inheriting child profile cannot deactivate an inherited rule, and a *copy*
# stops receiving new Sonar rules. Suppressing this one rule keeps the built-in
# profile — and its future updates — intact.
