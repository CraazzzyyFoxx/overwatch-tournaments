<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWT — турниры сообществ Overwatch</title>
<meta name="description" content="Расписание, сетки и матчи всех сообществ Overwatch на OWT и история каждого игрока в одном профиле.">
<link rel="icon" href="frontend/public/brand-mark.svg">
<link rel="stylesheet" href="design/owt-mock.css">
<!--
  Platform home (apex host only). Mockup → src/app/(site)/(home)/page.tsx.
  On a community host "/" renders the community page instead (decision Q7),
  so this page has no tenant variant.

  Sections, top to bottom, each its own Suspense boundary in the app:
    HomeHero          hero copy + player search, one column
    NowOnPlatform     bento: the lead active tournament big (running, else first
                      open registration) + 4 small cards — the other active ones,
                      then the most recently finished across communities;
                      nothing active → the last finished one is the big card
    Directory         carousel of public communities, active-first then by size;
                      shows a host only for a verified custom domain
    PlatformLeaders   totals list (teams, days, hours and champions are not in
                      the API yet: shown as gaps) + champions + best winrate
    Showcase          3 real production screenshots (design/shots): player
                      profile, tournament page, match — split heads, Linear-style
    OrganizerBanner   one CTA → /get-workspace (decision Q9/Q15)
-->
<style>
  .home { display: flex; flex-direction: column; gap: var(--section-gap); padding-top: 20px; }

  /* hero */
  .hero-body { padding: clamp(22px, 2.6vw, 36px); }
  .hero-title { margin-top: 12px; max-width: 22em; font: 600 var(--text-display)/1.05 var(--aqt-display); letter-spacing: -0.015em; text-wrap: balance; }
  .hero-title .accent { color: var(--aqt-teal); }
  .hero-lede { margin-top: 12px; }
  /* search and the primary CTA share one row; secondary text links go under it */
  .hero-find { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .hero-search { flex: 1 1 280px; max-width: 520px; }
  .hero-actions { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 0 22px; }
  .text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--aqt-fg-muted); font-size: var(--text-body); }
  .text-link .icon { color: var(--aqt-teal); }
  .text-link:hover { color: var(--aqt-fg); }

  /* now on the platform: bento on rules, no boxes — the lead tournament big under
     a 2px rule in its status colour (--c), 4 small items under hairlines */
  .now { display: grid; gap: 28px 32px; grid-template-columns: minmax(0, 1.25fr) repeat(2, minmax(0, 1fr)); }
  .now > .feat { grid-row: span 2; }
  /* a link item without a box: its rule turns teal on hover */
  .tcard { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; padding-top: 16px; border-top: 1px solid var(--aqt-border-3); transition: border-color .15s ease; }
  .tcard:hover { border-top-color: var(--aqt-teal); }
  .tcard:focus-visible { outline-offset: 4px; }
  .tcard__name { font: 700 var(--text-ui)/1.3 var(--aqt-display); color: var(--aqt-fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tcard__ws { display: flex; align-items: center; gap: 8px; max-width: 100%; font-size: var(--text-caption); color: var(--aqt-fg-muted); }
  .tcard__ws span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard__line { margin-top: auto; font-size: var(--text-caption); color: var(--aqt-fg-dim); }
  .tcard__line b { font-weight: 600; color: var(--aqt-fg); }
  @media (max-width: 1099px) { .now { grid-template-columns: repeat(2, minmax(0, 1fr)); } .now > .feat { grid-column: 1 / -1; grid-row: auto; } }
  @media (max-width: 639px) { .now { grid-template-columns: minmax(0, 1fr); } }

  /* directory */
  .ws-card { display: flex; flex-direction: column; gap: 12px; min-height: 100%; padding-top: 16px; border-top: 1px solid var(--aqt-border-3); transition: border-color .15s ease; }
  .ws-card:hover { border-top-color: var(--aqt-teal); }
  .ws-card__name { display: flex; align-items: center; gap: 6px; min-width: 0; font: 700 var(--text-heading)/1.2 var(--aqt-display); }
  .ws-card__name > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-card__host { margin-top: 2px; font-size: var(--text-caption); color: var(--aqt-fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-card__desc { font-size: var(--text-body); color: var(--aqt-fg-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ws-card__foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px; padding-top: 4px; }
  /* carousel: whole cards only. Exactly 1 / 2 / 3 cards per view, every stop
     lands on a card edge, so nothing is ever cut; position dots say there is
     more. Autoplay has a visible pause control on every viewport (WCAG 2.2.2);
     arrows ≥ md only. */
  .rail-nav { display: flex; gap: 6px; }
  .rail-nav [data-rail] { display: none; }
  @media (min-width: 768px) { .rail-nav [data-rail] { display: inline-flex; } }
  .rail-nav .btn:disabled { opacity: .4; cursor: default; }
  .rail { overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block: 2px; }
  .rail::-webkit-scrollbar { display: none; }
  .rail__list { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 32px; }
  @media (min-width: 640px) { .rail__list { grid-auto-columns: calc((100% - 32px) / 2); } }
  @media (min-width: 1100px) { .rail__list { grid-auto-columns: calc((100% - 2 * 32px) / 3); } }
  .rail__list > li { min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }
  .rail-dots { display: flex; justify-content: center; gap: 2px; margin-top: 12px; }
  .rail-dot { width: 24px; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  .rail-dot::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--aqt-border-3); transition: width .2s ease, background-color .2s ease; }
  .rail-dot:hover::before { background: var(--aqt-fg-faint); }
  .rail-dot[aria-current="true"]::before { width: 18px; background: var(--aqt-teal); }
  /* mouse drag = the touch swipe for desktop; snapping is off while the hand moves */
  @media (pointer: fine) { .rail { cursor: grab; } }
  .rail.is-dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
  .rail.is-dragging a { pointer-events: none; }
  .ws-card:focus-visible { outline-offset: -2px; }
  .ws-card__top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }

  /* organizer banner */
  .org { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px 40px; padding: clamp(24px, 3vw, 36px) clamp(24px, 3.2vw, 44px); }
  .org p { margin-top: 8px; }
  @media (max-width: 767px) { .org { grid-template-columns: 1fr; } .org .btn { justify-self: start; } }
  .ws-card__foot .metric + .metric { padding-left: 22px; border-left: 1px solid var(--aqt-border); }
</style>
</head>
<body>
<div id="app"></div>
<script src="design/owt-icons.js"></script>
<script src="design/owt-data.js"></script>
<script src="design/owt-mock.js"></script>
<script>
const { D, NOW, html, raw, icon, fmt, community, host, wsAvatar, trustedBadge, statusPill, STATUS, fact, kpiList, leaderboard, show } = OWT;

/* Active tournaments per state. "real" is the API today (one registration).
   "live" re-labels REAL completed tournaments as running — names, communities
   and counts are real, only status and dates are simulated. */
const day = (d) => new Date(NOW.getTime() + d * 864e5).toISOString();
function activeFor(state) {
  if (state.events === "none") return [];
  const real = D.active.map((t) => ({ ...t, stage: null }));
  if (state.events === "real") return real;
  const owt2 = D.workspaces["jaristo-squad"].chronicle.find((t) => t.name === "OWT #2");
  return [
    { ...owt2, workspace: "jaristo-squad", status: "playoffs", stage: "Плей-офф", start: day(-1), end: day(0), registrations: owt2.participants },
    ...real,
  ];
}
const isReg = (t) => ["registration", "check_in", "announcement"].includes(t.status);
const regEnd = (t) => t.phases?.find((p) => p.status === "registration")?.ends_at;

const errorState = (what) => html`
  <div class="state state--error state--dashed" role="status">${icon("circle-alert")}
    <div><b>Не удалось загрузить ${what}</b>Это ошибка загрузки, а не пустой список.<br><button class="btn btn--outline btn--sm" type="button">${icon("refresh-cw", "icon--sm")}Повторить</button></div>
  </div>`;

function feature(t) {
  const c = community(t.workspace);
  if (STATUS[t.status][0] === "live") return html`
    <div class="feat" style="--c:var(--aqt-status-live)">
      <div>
        <div class="feat__kicker"><span class="live-dot" aria-hidden="true"></span>Сейчас идёт</div>
        <a href="#" class="feat__name sk">${t.name}</a>
        <div class="feat__ws sk">${wsAvatar(c, 20)}${c.name}</div>
      </div>
      <div class="feat__facts">
        ${t.stage ? fact(t.stage, "стадия") : ""}
        ${fact(fmt.num(t.teams), fmt.plural(t.teams, ["команда", "команды", "команд"]))}
        ${fact(fmt.num(t.participants), fmt.plural(t.participants, ["участник", "участника", "участников"]))}
      </div>
      <div class="feat__actions"><a class="btn btn--outline btn--sm" href="#">${icon("network", "icon--sm")}Сетка</a><a class="btn btn--ghost btn--sm" href="#">Матчи</a></div>
    </div>`;
  const start = t.phases?.find((p) => p.status === "live")?.starts_at ?? t.start;
  return html`
    <div class="feat" style="--c:var(--aqt-status-upcoming)">
      <div>
        <div class="feat__kicker">${icon("calendar", "icon--sm")}Открыта регистрация</div>
        <a href="#" class="feat__name sk">${t.name}</a>
        <div class="feat__ws sk">${wsAvatar(c, 20)}${c.name}</div>
        <div class="feat__meta sk">${t.formation === "solo" ? "Соло-заявка" : "Заявка командой"}</div>
      </div>
      <div class="feat__facts">
        ${fact(html`<time datetime="${regEnd(t)}" title="${fmt.dateTime(regEnd(t))} МСК">до ${fmt.dateTime(regEnd(t))}</time>`, "приём заявок")}
        ${fact(html`<time datetime="${start}">${fmt.dateTime(start)}</time>`, "старт")}
        ${fact(fmt.num(t.registrations), fmt.plural(t.registrations, ["заявка", "заявки", "заявок"]))}
      </div>
      <div class="feat__actions"><a class="btn btn--outline btn--sm" href="#">Подать заявку</a><a class="btn btn--ghost btn--sm" href="#">О турнире</a></div>
    </div>`;
}

// Nothing active: the last finished tournament and its winner, never a blank box.
function lastFinished(t) {
  const c = community(t.workspace);
  return html`
    <div class="feat" style="--c:var(--aqt-fg-faint)">
      <div>
        <div class="feat__kicker">${icon("clock", "icon--sm")}Сейчас турниров нет</div>
        <div class="eyebrow" style="margin-bottom:8px">Последний турнир</div>
        <a href="#" class="feat__name sk">${t.name}</a>
        <div class="feat__ws sk">${wsAvatar(c, 20)}${c.name} · <time datetime="${t.start}" title="${fmt.dateLong(t.start)}">${fmt.date(t.start)}</time></div>
        <div class="feat__meta sk" style="color:var(--aqt-fg)">${icon("trophy", "icon--sm")} Победила команда <b>${t.winner.team}</b></div>
        <div class="roster sk">${t.winner.players.map((p) => html`<a href="#">${p}</a>`)}</div>
      </div>
      <a class="more" href="#">Архив турниров${icon("arrow-right", "icon--sm")}</a>
    </div>`;
}

function hero(state) {
  return html`
    <section class="hero-frame" aria-labelledby="hero-title"><span class="hero-frame__glow" aria-hidden="true"></span>
      <div class="hero-body">
        <p class="eyebrow">OWT · турниры сообществ Overwatch</p>
        <h1 class="hero-title" id="hero-title">Турниры сообществ Overwatch и <span class="accent">статистика</span> игроков</h1>
        <p class="lede hero-lede">Расписание, сетки и матчи всех сообществ — и вся история игрока в одном профиле.</p>
        <div class="hero-find">
          <form class="hero-search pop-anchor" role="search" data-search onsubmit="event.preventDefault()">
            <label class="input"><span class="sr-only">Поиск игрока</span>${icon("search")}
              <input type="search" role="combobox" aria-expanded="false" aria-controls="hero-search-list" aria-autocomplete="list" placeholder="Игрок или BattleTag" autocomplete="off">
            </label>
            <div class="pop" id="hero-search-list" style="right:0" hidden></div>
          </form>
          <a class="btn btn--primary btn--lg" href="#">Смотреть турниры</a>
        </div>
        <div class="hero-actions">
          ${state.auth === "in" ? html`<a class="text-link" href="#">${icon("user")}Мой профиль и статистика</a>` : ""}
          <a class="text-link" href="OWT Get Workspace.html">${icon("trophy")}Провести турнир на OWT</a>
        </div>
      </div>
    </section>`;
}

// Every finished tournament across communities, newest first.
const finished = Object.entries(D.workspaces)
  .flatMap(([workspace, w]) => w.chronicle.map((t) => ({ ...t, workspace })))
  .sort((a, b) => b.start.localeCompare(a.start));

function tcard(t) {
  const c = community(t.workspace);
  const line = STATUS[t.status][0] === "finished"
    ? html`<time datetime="${t.start}" title="${fmt.dateLong(t.start)}">${fmt.date(t.start)}</time> · победила <b>${t.winner.team}</b>`
    : isReg(t) ? `Заявки до ${fmt.date(regEnd(t))} · ${fmt.count(t.registrations, ["заявка", "заявки", "заявок"])}`
    : `${fmt.count(t.teams, ["команда", "команды", "команд"])} · ${fmt.count(t.participants, ["участник", "участника", "участников"])}`;
  return html`<a class="tcard" href="#">
    ${statusPill(t.status, t.stage ?? undefined)}
    <b class="tcard__name sk">${t.name}</b>
    <span class="tcard__ws sk">${wsAvatar(c, 20)}<span>${c.name}</span></span>
    <span class="tcard__line sk">${line}</span>
  </a>`;
}

function now(state, active) {
  const lead = active.find((t) => STATUS[t.status][0] === "live") ?? active.find(isReg);
  // "live" mock state re-labels a finished tournament as running: never list it twice
  const done = finished.filter((f) => !active.some((t) => t.workspace === f.workspace && t.name === f.name));
  const big = lead ?? done[0];
  const small = [...active, ...done].filter((t) => t !== big).slice(0, 4);
  return html`
    <section id="now" class="sec sec--closed" aria-labelledby="now-title">
      <div class="section-head"><div><span class="eyebrow rubric">Турниры</span><h2 class="h-title" id="now-title">Сейчас на платформе</h2></div><a class="more" href="#">Все турниры${icon("arrow-right", "icon--sm")}</a></div>
      ${state.error === "1" ? errorState("активные турниры") : html`
      <div class="now">
        ${lead ? feature(lead) : lastFinished(big)}
        ${small.map(tcard)}
      </div>`}
    </section>`;
}

function directory(state, active) {
  const activeBy = Object.fromEntries(active.map((t) => [t.workspace, t]));
  const list = [...D.communities].sort((a, b) => (activeBy[b.slug] ? 1 : 0) - (activeBy[a.slug] ? 1 : 0) || b.tournaments - a.tournaments);
  const page = (c) => (D.workspaces[c.slug] ? `OWT Workspace Final.html#ws=${c.slug}` : "#");
  return html`
    <section id="directory" class="sec" aria-labelledby="dir-title">
      <div class="section-head"><div><span class="eyebrow rubric">Каталог</span><h2 class="h-title" id="dir-title">Сообщества на OWT</h2><p>В каталоге — сообщества, прошедшие проверку.</p></div>
        ${state.error === "1" ? "" : html`<div class="rail-nav"><button class="btn btn--outline btn--icon" type="button" data-autoplay aria-controls="dir-rail" aria-label="Остановить автопрокрутку">${icon("pause")}</button><button class="btn btn--outline btn--icon" type="button" data-rail="-1" aria-controls="dir-rail" aria-label="Предыдущие сообщества" disabled>${icon("chevron-left")}</button><button class="btn btn--outline btn--icon" type="button" data-rail="1" aria-controls="dir-rail" aria-label="Следующие сообщества">${icon("chevron-right")}</button></div>`}
      </div>
      ${state.error === "1" ? errorState("каталог сообществ") : html`
      <div class="rail" id="dir-rail" role="region" aria-label="Сообщества на OWT" tabindex="0"><ul class="rail__list">
        ${list.map((c) => {
          const a = activeBy[c.slug];
          return html`<li><a class="ws-card" href="${page(c)}">
            <div class="ws-card__top">${wsAvatar(c, 44, "sk")}
              <div style="min-width:0;flex:1"><div class="ws-card__name"><span class="sk">${c.name}</span>${trustedBadge(c)}</div>${host(c) ? html`<div class="ws-card__host sk">${host(c)}</div>` : ""}</div>
            </div>
            ${a ? html`<div>${statusPill(a.status, STATUS[a.status][0] === "live" ? "Идёт турнир" : undefined)}</div>` : ""}
            ${c.description ? html`<p class="ws-card__desc sk">${c.description}</p>` : ""}
            <div class="ws-card__foot">
              <span class="metric"><b class="sk">${fmt.num(c.tournaments)}</b><span>${fmt.plural(c.tournaments, ["турнир", "турнира", "турниров"])}</span></span>
              <span class="metric"><b class="sk">${fmt.num(c.players)}</b><span>${fmt.plural(c.players, ["игрок", "игрока", "игроков"])}</span></span>
            </div>
          </a></li>`;
        })}
      </ul></div>
      <div class="rail-dots" id="dir-dots" role="group" aria-label="Позиция в каталоге"></div>`}
    </section>`;
}

function leaders(state) {
  const err = state.error === "1";
  return html`
    <section class="sec" aria-labelledby="leaders-title">
      <div class="section-head"><div><span class="eyebrow rubric">Статистика</span><h2 class="h-title" id="leaders-title">Лидеры платформы</h2><p>По всем сообществам за всё время.</p></div><a class="more" href="#">Вся статистика${icon("arrow-right", "icon--sm")}</a></div>
      <div class="leaders">
        ${kpiList({ title: "Платформа в цифрах", totals: D.platform.totals, keys: ["communities", "tournaments", "teams", "players", "encounters", "maps", "days", "hours", "champions"], path: "platform.totals", err })}
        ${leaderboard("Больше всего побед", err ? null : D.platform.champions, (v) => `${v}×`, "var(--aqt-amber)", "турниров выиграно")}
        ${leaderboard("Лучший винрейт", err ? null : D.platform.winrate, fmt.pct, "var(--aqt-emerald)", raw('<span title="Учитываются игроки, сыгравшие больше 3 турниров">от 4 турниров</span>'))}
      </div>
    </section>`;
}

// Screenshots of the live site (owt.craazzzyyfoxx.me, Anakq, RU), not mock data.
const showcase = () => html`
  <section class="sec" aria-labelledby="show-title">
    <div class="section-head"><div><span class="eyebrow rubric">Платформа</span><h2 class="h-title" id="show-title">Как это выглядит</h2><p>Скриншоты живой платформы: настоящие игроки, турниры и матчи.</p></div></div>
    ${show({ title: "Профиль игрока", text: "Турниры, винрейт, форма за последние десять, роли и любимые герои — в одном профиле.", more: ["Найти игрока", "#"], img: "player-profile.webp", alt: "Профиль игрока CraazzzyyFox: 26 турниров, винрейт 50%, форма за последние 10 турниров, распределение по ролям и статистика последнего турнира" })}
    ${show({ title: "Страница турнира", text: "Итог, сетка плей-офф, самые сыгранные герои и формат — на одной странице.", more: ["Все турниры", "#"], img: "tournament-overview.webp", alt: "Страница турнира «Турнир Сабов Anakq #42»: чемпион Tref, финал сетки, самые сыгранные герои" })}
    ${show({ title: "Матч", text: "Счёт серии, карты, время игры и логи каждой карты.", more: ["Все матчи", "#"], img: "match.webp", alt: "Матч Tref против vac3x: счёт 3:1, четыре сыгранные карты с логами" })}
  </section>`;

const organizerBanner = () => html`
  <section class="hero-frame" aria-labelledby="org-title"><span class="hero-frame__glow" aria-hidden="true"></span>
    <div class="org">
      <div><p class="eyebrow">Для организаторов</p><h2 class="h-title" id="org-title" style="margin-top:8px">Проводите турниры своего сообщества на OWT</h2>
        <p class="lede">Регистрация, балансировщик, сетки и статистика матчей. Страница сообщества открывается сразу после создания.</p></div>
      <a class="btn btn--primary btn--lg" href="OWT Get Workspace.html">Создать сообщество${icon("arrow-right")}</a>
    </div>
  </section>`;

/* Carousel behaviour. Everything moves in whole cards: positions are card
   indices, a stop is index × (card + gap), the last stop is cards − perView.
   Autoplay: one card every 6 s, rewinds at the end. It waits while the pointer
   is over the section, focus is inside it, the rail is off-screen or the tab is
   hidden, and it is OFF by default under prefers-reduced-motion. Any manual
   navigation (arrows, dots, drag, wheel, swipe, keys) turns it off for good —
   the visitor has taken over; the pause/play button turns it back on.
   Arrows move a whole view (perView cards). Drag: mouse only (touch already
   swipes natively); past a 6 px threshold the drag owns the gesture, the click
   that ends it is swallowed, and the rail lands on the nearest card. */
const AUTOPLAY_MS = 6000, GAP = 32;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let autoplayOn = !reduceMotion.matches; // survives re-renders: a stop is a stop
let tick = null;

function syncRail() {
  clearInterval(tick);
  const rail = document.getElementById("dir-rail");
  if (!rail) return;
  const section = document.getElementById("directory");
  const nav = section.querySelector(".rail-nav");
  const dots = document.getElementById("dir-dots");
  const [toggle, prev, next] = nav.children;
  const behavior = () => (reduceMotion.matches ? "auto" : "smooth");
  const stepW = () => rail.querySelector("li").getBoundingClientRect().width + GAP;
  const maxLeft = () => rail.scrollWidth - rail.clientWidth;
  const cards = () => rail.querySelectorAll("li").length;
  const perView = () => Math.max(1, Math.round((rail.clientWidth + GAP) / stepW()));
  const lastIndex = () => Math.max(0, cards() - perView());
  const index = () => Math.min(lastIndex(), Math.round(rail.scrollLeft / stepW()));
  const go = (i, smooth = true) => rail.scrollTo({ left: Math.min(maxLeft(), Math.max(0, Math.min(lastIndex(), i)) * stepW()), behavior: smooth ? behavior() : "auto" });
  let hovered = false, focused = false, visible = true, dragging = false, last = Date.now();

  const update = () => {
    const max = maxLeft(), i = index(), n = lastIndex() + 1;
    nav.hidden = dots.hidden = max <= 1;
    prev.disabled = rail.scrollLeft <= 1;
    next.disabled = rail.scrollLeft >= max - 1;
    if (dots.childElementCount !== n) {
      const pv = perView();
      dots.innerHTML = Array.from({ length: n }, (_, k) => `<button class="rail-dot" type="button" data-dot="${k}" aria-label="${pv > 1 ? `Сообщества ${k + 1}–${k + pv}` : `Сообщество ${k + 1}`} из ${cards()}"></button>`).join("");
    }
    [...dots.children].forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
    toggle.setAttribute("aria-label", autoplayOn ? "Остановить автопрокрутку" : "Запустить автопрокрутку");
    toggle.innerHTML = icon(autoplayOn ? "pause" : "play").s;
  };
  const takeOver = () => { if (autoplayOn) { autoplayOn = false; update(); } };

  tick = setInterval(() => {
    if (!autoplayOn || hovered || focused || !visible || dragging || document.hidden || maxLeft() <= 1) { last = Date.now(); return; }
    if (Date.now() - last < AUTOPLAY_MS) return;
    last = Date.now();
    go(index() >= lastIndex() ? 0 : index() + 1);
  }, 250);

  section.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") hovered = true; });
  section.addEventListener("pointerleave", () => { hovered = false; });
  rail.addEventListener("focusin", () => { focused = true; });
  rail.addEventListener("focusout", (e) => { if (!rail.contains(e.relatedTarget)) focused = false; });
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; }, { threshold: 0.5 }).observe(rail);
  rail.addEventListener("wheel", (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) takeOver(); }, { passive: true });
  rail.addEventListener("touchstart", takeOver, { passive: true });
  rail.addEventListener("keydown", (e) => { if (["ArrowLeft", "ArrowRight", "Home", "End", "PageUp", "PageDown"].includes(e.key)) takeOver(); });

  toggle.addEventListener("click", () => { autoplayOn = !autoplayOn; last = Date.now(); update(); });
  for (const b of [prev, next]) b.addEventListener("click", () => { takeOver(); go(index() + Number(b.dataset.rail) * perView()); });
  dots.addEventListener("click", (e) => { const d = e.target.closest("[data-dot]"); if (d) { takeOver(); go(Number(d.dataset.dot)); } });

  let startX = 0, startLeft = 0, pid = null, moved = false;
  rail.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    pid = e.pointerId; startX = e.clientX; startLeft = rail.scrollLeft; moved = false;
  });
  rail.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - startX;
    if (!moved) {
      if (Math.abs(dx) < 6) return;
      moved = dragging = true;
      takeOver();
      rail.classList.add("is-dragging");
      rail.setPointerCapture(pid);
    }
    rail.scrollLeft = startLeft - dx;
  });
  const endDrag = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (!moved) return;
    dragging = false;
    // land on the nearest whole card, then hand snapping back to CSS
    go(Math.round(rail.scrollLeft / stepW()));
    const release = () => rail.classList.remove("is-dragging");
    if ("onscrollend" in rail && behavior() === "smooth") rail.addEventListener("scrollend", release, { once: true });
    else release();
  };
  rail.addEventListener("pointerup", endDrag);
  rail.addEventListener("pointercancel", endDrag);
  rail.addEventListener("click", (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  rail.addEventListener("dragstart", (e) => e.preventDefault());

  rail.addEventListener("scroll", update, { passive: true });
  // a breakpoint change alters cards-per-view: re-seat on the same card, instantly
  new ResizeObserver(() => { go(index(), false); update(); }).observe(rail);
  update();
}
OWT.mount({
  defaults: { auth: "out", events: "real", inbox: "new", ann: "on", loading: "0", error: "0" },
  schema: [
    { key: "auth", label: "Пользователь", options: [["out", "Гость"], ["in", "Вошёл"]] },
    { key: "inbox", label: "Уведомления (у вошедшего)", options: [["new", "3 новых, 2 дела"], ["read", "Всё прочитано"], ["empty", "Пусто"], ["error", "Ошибка"]] },
    { key: "ann", label: "Объявление", options: [["on", "Есть"], ["off", "Нет"]] },
    { key: "events", label: "Турниры", options: [["real", "Как сейчас (1 регистрация)"], ["live", "Идёт + регистрация"], ["none", "Ничего"]] },
    { key: "loading", label: "Загрузка", options: [["0", "Данные"], ["1", "Скелетоны"]] },
    { key: "error", label: "Ошибка API", options: [["0", "Нет"], ["1", "Все блоки"]] },
  ],
  note: `Данные — снимок публичного API (${D.snapshot}). «Идёт + регистрация» — реальные турниры с симулированным статусом. Уведомления и объявление — примеры на реальных турнирах и командах.`,
  render(state) {
    const active = activeFor(state);
    return html`
      ${OWT.header({ tenant: null, current: null, auth: state.auth, active, inbox: state.inbox })}
      ${OWT.floatStack({ auth: state.auth, ann: state.ann === "on" })}
      <main id="main" class="shell home" tabindex="-1">
        ${hero(state)}
        ${now(state, active)}
        ${directory(state, active)}
        ${leaders(state)}
        ${showcase()}
        ${organizerBanner()}
      </main>
      ${OWT.footer({ tenant: null })}`;
  },
  after: syncRail,
});

</script>
</body>
</html>
