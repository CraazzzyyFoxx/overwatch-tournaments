version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ⬆
  # Python
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ⬆
  # backend base image digest: each bump is a full venv re-pull on the host,
  # so weekly, not daily.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: ⬆
    # Python minor bumps go with uv.lock/requires-python, not alone: 3.15 shipped
    # before psycopg-binary had cp315 wheels and broke every backend build.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
