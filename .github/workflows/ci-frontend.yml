name: CI Frontend

# The frontend had no CI at all: 140 test files, a typechecker and eslint, none
# of it gated. A vitest suite that had silently stopped collecting nine files
# stayed green for as long as nobody read vitest.config.ts.
#
# Paths-filtered: nothing here is affected by a backend-only change, and a job
# that always runs is a job people learn to ignore.
on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  # Callable so the release deploy gates on this exact job. Path filters do not
  # apply to a workflow_call, so a release always runs the whole thing.
  workflow_call:

defaults:
  run:
    working-directory: frontend

jobs:
  ci-frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # bun is the app's own runtime (both Dockerfiles are oven/bun), so the same
      # toolchain installs deps and drives every script here.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      # Node is what vitest runs on: its environment is happy-dom under Node.
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # Structural gate, not style: the app is one deployable split into route
      # zones (admin / web / tools), and the zones only stay separable while
      # nothing reaches across them. ESLint cannot state this — see the header
      # of the script for why — so it is its own step, next to the linter.
      - name: Zone boundaries
        run: bun run lint:zones
      - name: Vitest suite
        run: bun run test:vitest
      # Last, and only on the branch: a Next production build is the slowest step
      # here and the only one needing app env, so PRs get the fast signal and
      # master gets the guarantee that the thing still builds. `.env` is
      # gitignored, so the checked-in example supplies the same keys a deploy
      # would; every route is server-rendered on demand, so no page fetches data
      # at build time and none of these values is contacted.
      - name: Production build
        if: ${{ github.event_name == 'push' }}
        run: |
          set -a
          . ./.env.example
          set +a
          bun run build
