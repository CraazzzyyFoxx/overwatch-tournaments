name: Lint Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  # Callable so the release deploy can gate on the very same gate a PR saw,
  # instead of a second copy of these commands drifting inside that workflow.
  workflow_call:

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint + format check
        run: uv run bash scripts/lint.sh
        working-directory: backend
      # The OpenAPI manifest the gateway embeds is hand-committed, exported from
      # the services' Pydantic models. Nothing forced the two to agree, and the
      # manifest has silently drifted before (+724/-175), leaving the public docs
      # advertising a contract the services no longer implement. ~10s.
      - name: OpenAPI manifest is up to date
        run: bash scripts/export_openapi_schemas.sh --check
        working-directory: backend
      # The OW ladder is written down once in shared/domain/ow_ladder.py; the
      # frontend reads a generated artifact (frontend/src/lib/ow-ladder.generated.json)
      # because its default division grid must resolve synchronously during SSR.
      # Without this gate a rebase of the ladder ships a frontend that renders the
      # previous one.
      - name: OW ladder artifact is up to date
        run: uv run python scripts/export_ow_ladder.py --check
        working-directory: backend
