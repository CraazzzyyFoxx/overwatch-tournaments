name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  # See lint-backend.yml: the release deploy calls this rather than restating it.
  workflow_call:

jobs:
  # One job per heavy suite, the light ones together; each suite also runs on
  # every runner CPU (pytest-xdist, `-n auto --dist loadfile` in its config).
  suite:
    name: test-backend (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            suites: stats-service
          - name: tournament
            suites: tournament-service
          - name: analytics-balancer
            suites: analytics-service balancer-service
          - name: rest
            suites: shared app-service identity-service discord-service stream-service tests
    services:
      # docker-compose.test.yml's container on the DSN shared/testing/test.env
      # commits (127.0.0.1:55432/anak_test). shared.testing.db probes it and
      # runs `alembic upgrade head` itself. No Redis or RabbitMQ: the suites use
      # fakeredis and in-memory brokers, and the live smoke tests that need the
      # real ones only run when P5_SMOKE_* is set.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anak_test
        ports:
          - 55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres -d anak_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The analytics artifact-conversion tests `git archive` a pre-move
          # revision (OLD_REVISION), which a depth-1 clone does not have.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # shared.testing.db turns an unreachable database or a failed migration
      # into a skip -- exactly how every DB test here used to vanish without a
      # failure. Migrating once up front makes either one a red step instead.
      # Same environment as its own upgrade: test.env plus the legacy drop.
      - name: Migrate the test database
        working-directory: backend
        env:
          OWT_APPLY_LEGACY_DROP: "1"
        run: uv run --env-file shared/testing/test.env alembic upgrade head
      # Each service is its own uv-workspace package with its own `src`, so the
      # suites run one package at a time (a single pytest over all of them would
      # collide on the duplicate top-level `src`). Coverage follows the xdist
      # workers through `patch = ["subprocess"]` (pyproject [tool.coverage.run]).
      - name: Run ${{ matrix.suites }}
        working-directory: backend
        run: |
          set -e
          for svc in ${{ matrix.suites }}; do
            case "$svc" in
              shared) src="shared"; path="shared/tests" ;;
              # The cross-service gates (module boundaries, D99 literals, repository
              # boundaries, migration/script tests) live in the root suite.
              tests) src="scripts"; path="tests" ;;
              *) src="$svc/src"; path="$svc/tests" ;;
            esac
            echo "::group::pytest $svc"
            uv run coverage run --parallel-mode --source="$src" -m pytest "$path"
            echo "::endgroup::"
          done
      - name: Store coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.name }}
          path: backend/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # Same job name as before the split: the deploy gate and branch rules see one result.
  test-backend:
    needs: suite
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Optional PAT (gist scope) used only to publish the coverage badge on
      # pushes to master. Absent on forks/PRs — the badge step is skipped then.
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Collect coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
          path: backend
          merge-multiple: true
      # Only coverage is needed here, not the workspace (whose dev group compiles lupa).
      - name: Combine coverage
        working-directory: backend
        run: |
          version=$(grep -A1 '^name = "coverage"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          python -m pip install --quiet "coverage==$version"
          coverage combine
          coverage report
          coverage json -o coverage.json
      - name: Compute coverage percentage
        id: cov
        if: ${{ github.event_name == 'push' }}
        working-directory: backend
        run: |
          pct=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
      # Publishes the shields.io endpoint JSON to the coverage gist. Runs only on
      # master pushes and only when the GIST_TOKEN secret is configured, so PRs
      # and un-configured repos stay green.
      - name: Publish coverage badge to gist
        if: ${{ github.event_name == 'push' && env.GIST_TOKEN != '' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: e00b7692443a542b0e505c090cf83d35
          filename: owt-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90
      - name: Store coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: backend/coverage.json
          if-no-files-found: ignore
