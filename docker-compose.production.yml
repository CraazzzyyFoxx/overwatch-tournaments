name: owt

# Docker's default json-file driver has NO size cap, and every service mirrors
# its structured logs to stderr on top of its own rotated file under ./logs —
# so /var/lib/docker/containers/*/*-json.log grew unbounded between the weekly
# ops/cleanup/cleanup.sh runs (docs/disk-cleanup.md). 50 MiB x 3 caps each
# container at 150 MiB and the daemon rotates it: no cron in the path.
x-logging: &log-rotate
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ==========================================================================
  # Bundled PostgreSQL + pgBouncer (profile `db`). Moscow and the dev site run
  # Postgres outside this project (db_postgres + db_pgbouncer) and leave the
  # profile off; a host with no database of its own sets COMPOSE_PROFILES=db
  # (plus telemetry) in the root .env. Setup, sizing, backups:
  # docs/production-host.md.
  #
  # Both read backend/env/common.env: the image takes the same POSTGRES_USER /
  # POSTGRES_PASSWORD / POSTGRES_DB the services use, so there is one copy of
  # the credentials. Nothing is published to the host.
  # ==========================================================================
  postgres:
    profiles: ["db"]
    image: postgres:18
    logging: *log-rotate
    restart: unless-stopped
    env_file:
      - ./backend/env/common.env
    # Sized for the minimum host (docs/production-host.md). A bigger box raises
    # the POSTGRES_* knobs in the root .env instead of editing this file: a
    # release checkout must stay clean (ops/deploy/remote-deploy.sh). Keep
    # shared_buffers ~25% and effective_cache_size ~75% of POSTGRES_MEMORY.
    # random_page_cost / effective_io_concurrency assume SSD storage.
    command: [
      "postgres",
      "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}",
      "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}",
      "-c", "work_mem=8MB",
      "-c", "maintenance_work_mem=128MB",
      "-c", "max_wal_size=2GB",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
    ]
    # Docker's 64 MB /dev/shm is too small for parallel query workers
    # ("could not resize shared memory segment").
    shm_size: 256m
    # The image stops with SIGINT (fast shutdown); Docker's 10 s default then
    # SIGKILLs a busy server mid-checkpoint and the next start replays WAL.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: ${POSTGRES_MEMORY:-2G}
        reservations:
          cpus: '0.50'
          memory: 768M
    volumes:
      # PG 18 images keep PGDATA at /var/lib/postgresql/18/docker under a
      # VOLUME at /var/lib/postgresql. A volume on the pre-18 .../data path
      # would leave the real data in an anonymous volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: the entrypoint's initdb-time server listens on the unix
      # socket only, so this passes once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # Transaction pooling: every replica's DB_POOL_SIZE + DB_MAX_OVERFLOW client
  # slots fan into DEFAULT_POOL_SIZE server backends, which is what lets
  # `make prod-up` replicate workers. Services connect as POSTGRES_HOST=pgbouncer
  # POSTGRES_PORT=6432 DB_PGBOUNCER=true. The upstream is DATABASE_URL (direct
  # postgres:5432) — the same variable alembic prefers, so migrations bypass
  # the pooler (backend/migrations/README). All in backend/env/common.env.
  pgbouncer:
    profiles: ["db"]
    image: edoburu/pgbouncer:v1.25.2-p0
    logging: *log-rotate
    restart: unless-stopped
    env_file:
      - ./backend/env/common.env
    environment:
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      # With scram-sha-256 the entrypoint writes the plain password to
      # userlist.txt, which pgBouncer needs to log in to the SCRAM-only server.
      AUTH_TYPE: scram-sha-256
      # Must cover replicas x (DB_POOL_SIZE + DB_MAX_OVERFLOW) + GATEWAY_DB_MAX_CONNS:
      # 14 processes x 30 + 16 = 436 at PROD_SIZE=large with the defaults.
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: 'redis/redis-stack:latest'
    logging: *log-rotate
    # maxmemory must be set explicitly: redis-server ignores the container's
    # cgroup limit below, so INFO memory reports maxmemory=0 (unlimited) and
    # `redis_memory_used_bytes / redis_memory_max_bytes` in the Prometheus
    # alert divides by zero (+Inf%) regardless of actual usage. 400mb leaves
    # headroom under the 512M limit for redis-stack module overhead
    # (RediSearch/RedisJSON). allkeys-lru is safe: every key here (RBAC
    # cache, OAuth/SSO tickets, session blacklist, feature cache) is
    # TTL-bound and callers already treat cache misses as a graceful
    # DB-fallback path, not a correctness failure.
    #
    # Set via REDIS_ARGS (not `command:`) — the image's /entrypoint.sh CMD
    # hardcodes --protected-mode no and --loadmodule for every redis-stack
    # module (RediSearch/RedisJSON/etc.) and appends ${REDIS_ARGS} last;
    # overriding `command:` skips the entrypoint entirely and silently
    # drops both protected-mode-off and all module loading.
    environment:
      REDIS_ARGS: "--maxmemory 400mb --maxmemory-policy allkeys-lru"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    logging: *log-rotate
    # Backbone: every RPC round-trips through the broker, so give it real CPU
    # headroom — throttling here adds latency to the whole stack.
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  proxy:
    image: teddysun/xray:latest
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: unless-stopped
    command: ["xray", "run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./proxy/xray.json:/etc/xray/config.json:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app-service is headless: served by app-svc (rpc.app.*) behind the gateway.
  # The former HTTP `backend` service was decommissioned.

  # parser-service HTTP decommissioned: parser is now a headless FastStream worker
  # (parser-svc below), serving its domains as typed RPC behind the gateway.
  # The bot uploads logs over RabbitMQ; the SSE log monitor moved to the WS hub.

  # realtime-service decommissioned: WebSockets are now served by the Go gateway
  # (gateway/internal/ws), consuming the same `realtime:*` Redis channels and
  # replaying from `realtime.workspace_event`. External `/api/realtime/*` flows
  # through nginx -> gateway:8080. Service code kept under
  # backend/realtime-service/ as reference (not deployed).

  discord-worker:
    image: ghcr.io/craazzzyyfoxx/owt-discord:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ./backend
      args:
        APP_PATH: discord
    command: python main.py
    env_file:
      - ./backend/env/common.env
      - ./backend/env/discord.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      # Same root value the frontend builds NEXT_PUBLIC_SITE_URL from: the bot's
      # "link Discord" / settings buttons must land on the site people actually use.
      - PUBLIC_SITE_URL=${SITE_URL:-https://owt.craazzzyyfoxx.me}
      - WORKER_METRICS_PORT=9100
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      proxy:
        condition: service_healthy
    volumes:
      - ./logs/discord-worker:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    # Reads the heartbeat file GatewayWatchdog touches while the Discord gateway
    # session is alive: the bot serves no port, and a session can die without
    # the process dying. start_period covers login + the first connect.
    healthcheck:
      test: ["CMD", "python", "-m", "src.tools.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: always

  # One-shot job: uploads the bot's missing application emoji, then exits. The
  # `tools` profile keeps `up` from starting it; ops/deploy/remote-deploy.sh runs
  # it on every release (and `make prod-discord-emoji` by hand). Idempotent --
  # names already uploaded are skipped -- and the bot re-reads its emoji every
  # 10 minutes, so nothing has to restart after it. The Overwatch rank badges
  # come from the checkout's static/divisions (the bot image does not carry them).
  discord-emoji:
    image: ghcr.io/craazzzyyfoxx/owt-discord:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    logging: *log-rotate
    command: python -m src.tools.emoji_sync
    env_file:
      - ./backend/env/common.env
      - ./backend/env/discord.env
    volumes:
      - ./static/divisions:/static/divisions:ro
    networks:
      - app-network
    healthcheck:
      disable: true
    restart: "no"

#  twitch:
#    image: ghcr.io/craazzzyyfoxx/owt-twitch:${IMAGE_TAG:-latest}
#    build:
#      context: ./backend
#      args:
#        APP_PATH: twitch
#    command: uvicorn main:app --host 0.0.0.0 --port 8082 --workers 2 --loop uvloop
#    env_file:
#      - ./backend/env/common.env
#      - ./backend/env/twitch.env
#    depends_on:
#      redis:
#        condition: service_started
#      rabbitmq:
#        condition: service_healthy
#      auth:
#        condition: service_healthy
#    volumes:
#      - ./logs/twitch:/logs
#    networks:
#      - app-network
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 40s
#    restart: always

  # balancer-service HTTP decommissioned: /api/balancer is served by the headless
  # balancer-svc (rpc.balancer.* config/admin/draft/jobs) behind the gateway.
  # The worker also consumes the balancer job queue + runs the draft clock + Rust
  # tournament_balancer. The dead SSE job-stream endpoint was removed (progress flows over the
  # tournament:{id}:balancer WS topic).

  # analytics-service HTTP decommissioned: /api/analytics is served by the headless
  # analytics-svc (rpc.analytics.* reads + job-control) behind the gateway; heavy ML
  # compute stays in analytics-worker (job queues).

  parser-svc:
    image: ghcr.io/craazzzyyfoxx/owt-parser:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '1.000'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    build:
      context: ./backend
      args:
        APP_PATH: parser
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/parser.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9100
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # OverFast runs on this host (/root/overfast-api behind the host HAProxy). Its public
      # name resolves to a front on another box; pin it here so rank and catalog calls stay
      # local. TLS still checks the real certificate.
      - "overfast.craazzzyyfoxx.me:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      proxy:
        condition: service_healthy
    volumes:
      - ./logs/parser-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  tournament-svc:
    image: ghcr.io/craazzzyyfoxx/owt-tournament:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 128M
    build:
      context: ./backend
      args:
        APP_PATH: tournament
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/tournament.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9103
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/tournament-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Headless RPC worker replacing the HTTP `backend` behind the gateway.
  app-svc:
    image: ghcr.io/craazzzyyfoxx/owt-app:${IMAGE_TAG:-latest}
    logging: *log-rotate
    # Hottest read/write path (all of /api/v1/core). Single event loop per
    # process, so raise the CPU ceiling AND scale replicas (`make prod-scale`)
    # for real throughput — the two are complementary.
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
    build:
      context: ./backend
      args:
        APP_PATH: app
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/app.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      # Same root value the frontend builds NEXT_PUBLIC_SITE_URL from: the
      # links in notification DMs must land on the site people actually use.
      - PUBLIC_SITE_URL=${SITE_URL:-https://owt.craazzzyyfoxx.me}
      - WORKER_METRICS_PORT=9109
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      proxy:
        condition: service_healthy
    volumes:
      - ./logs/app-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  balancer-svc:
    image: ghcr.io/craazzzyyfoxx/owt-balancer:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 768M
        reservations:
          cpus: '0.10'
          memory: 256M
    build:
      context: ./backend
      args:
        APP_PATH: balancer
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/balancer.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      # Same root value the frontend builds NEXT_PUBLIC_SITE_URL from: the mix
      # signup card's board button must land on the site people actually use.
      - PUBLIC_SITE_URL=${SITE_URL:-https://owt.craazzzyyfoxx.me}
      - WORKER_METRICS_PORT=9100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/balancer-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  analytics-worker:
    image: ghcr.io/craazzzyyfoxx/owt-analytics:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          # Training is the only CPU-hungry thing in the stack, so the ceiling
          # is per host: 8 fits the 8-core box, the 4-core one sets
          # ANALYTICS_WORKER_CPUS=3 in its .env. A committed number meant the
          # smaller host carried a permanent local edit to this file, which is
          # exactly what a release checkout cannot tolerate.
          cpus: '${ANALYTICS_WORKER_CPUS:-8.00}'
          memory: ${ANALYTICS_WORKER_MEMORY:-4G}
        reservations:
          cpus: '1.00'
          memory: 1G
    build:
      context: ./backend
      args:
        APP_PATH: analytics
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/analytics.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9106
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/.cache/analytics:/cache/analytics
      - analytics-models:/opt/owt/models
      - ./logs/analytics-worker:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Headless RPC face for analytics reads/mutations/job-control (rpc.analytics.*),
  # consumed by the gateway's analytics edge routes. The heavy ML work stays in
  # analytics-worker; this is the light request/reply service (serve_rpc:app).
  analytics-svc:
    image: ghcr.io/craazzzyyfoxx/owt-analytics:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    build:
      context: ./backend
      args:
        APP_PATH: analytics
    command: faststream run serve_rpc:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/analytics.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9108
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/analytics-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Tournament stream live-status: hosts rpc.stream.* for the gateway and runs
  # the Twitch poll tick. Owns no Postgres schema — live state is Redis-only,
  # and polling stays off until the `stream.collection` admin setting enables it.
  # Do NOT scale past one replica for polling's sake: the tick is Redis
  # leader-locked, so extras only add RPC consumer capacity.
  stream-svc:
    image: ghcr.io/craazzzyyfoxx/owt-stream:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ./backend
      args:
        APP_PATH: stream
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/stream.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9111
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/stream-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # Next standalone runs `node server.js`: ONE process, so one JS thread no
  # matter how high the CPU ceiling goes. Every SSR render on the site queues
  # behind that single event loop — which is why on 2026-08-15 a burst pushed
  # /privacy, a page with no data at all, from 100ms to a 2.6s average and the
  # site's p90 to 7.2s. Throughput here comes from REPLICAS, not from cpus.
  #
  # Default 1 matches PROD_SIZE=small. medium/large raise this via
  # `docker compose --scale frontend=N` (Makefile prod-up / GitHub release).
  # Compose DNS returns every replica IP for the `frontend` name, and nginx
  # (runtime resolver, nginx/nginx.conf) round-robins across them, so traffic
  # spreads with no extra config.
  #
  # 1.50 per replica rather than the old 3.00: a single event loop cannot spend
  # three cores, and three replicas at the old ceiling would have oversubscribed
  # this 8-core box badly enough to starve nginx and the gateway under load.
  #
  # 1G per replica rather than 2GB. Normal working set is 100-400 MB; the
  # 2026-09-30 flood took a replica to 1.23 GB and the host (12.5 GB, ~27 GB of
  # container limits) into full swap before any limit was near. A replica that
  # passes 1G now restarts on its own instead of swapping the host. Node 22 sizes
  # its heap to half the cgroup limit (549 MB at 1G), the rest is native memory.
  frontend:
    image: ghcr.io/craazzzyyfoxx/owt-frontend:${IMAGE_TAG:-latest}
    logging: *log-rotate
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    build:
      context: ./frontend
      dockerfile: prod.Dockerfile
      args:
        NEXT_PUBLIC_CACHE_POLICY: ${NEXT_PUBLIC_CACHE_POLICY}
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-Overwatch Tournaments}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://owt.craazzzyyfoxx.me}
        NEXT_PUBLIC_PLATFORM_ZONE: ${PLATFORM_ZONE:-owt.craazzzyyfoxx.me}
        NEXT_PUBLIC_COOKIE_PREFIX: ${COOKIE_PREFIX:-owt}
        NEXT_PUBLIC_SITE_ICON: ${NEXT_PUBLIC_SITE_ICON}
        NEXT_PUBLIC_SITE_FAVICON: ${NEXT_PUBLIC_SITE_FAVICON}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID}
        NEXT_PUBLIC_APP_VERSION: ${IMAGE_TAG:-}
    environment:
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-https://owt.craazzzyyfoxx.me}
      - NEXT_PUBLIC_SITE_NAME=${SITE_NAME:-Overwatch Tournaments}
      - NEXT_PUBLIC_PLATFORM_ZONE=${PLATFORM_ZONE:-owt.craazzzyyfoxx.me}
      - NEXT_PUBLIC_COOKIE_PREFIX=${COOKIE_PREFIX:-owt}
      - NEXT_PUBLIC_CACHE_POLICY=${NEXT_PUBLIC_CACHE_POLICY}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      - NEXT_PUBLIC_YM_ID=${NEXT_PUBLIC_YM_ID}
      # Single gateway origin: the browser uses relative same-origin paths; only
      # server-side (SSR + route handlers + proxy) fetches need a base.
      - NEXT_INTERNAL_API_URL=${NEXT_INTERNAL_API_URL:-http://gateway:8080}
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - ./logs/frontend:/logs
      # Optional: override the browser favicon at runtime
      # - ./conf/favicon.ico:/app/public/favicon.ico:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  # ==========================================================================
  # Gateway architecture — part of the DEFAULT stack.
  # The gateway is the single API entry point: backend services validate tokens
  # through it (AUTH_SERVICE_URL=http://gateway:8080/api/auth is set on each
  # consumer below) -> RPC -> identity-svc, and the gateway serves /api/* (typed
  # RPC) + the WebSocket hub. nginx is the external edge (Kong removed) and
  # routes pages straight to the frontend.
  #   TLS terminator -> nginx -> gateway -> RPC -> identity
  #                          \-> frontend
  # ==========================================================================

  identity-svc:
    image: ghcr.io/craazzzyyfoxx/owt-identity:${IMAGE_TAG:-latest}
    logging: *log-rotate
    # Auth hot path: every authenticated request validates its token via
    # gateway -> identity-svc. Under-provisioning this throttles all traffic.
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 256M
    build:
      context: ./backend
      args:
        APP_PATH: identity
    command: faststream run serve:app
    env_file:
      - ./backend/env/common.env
      - ./backend/env/auth.env
      - ./backend/env/identity.env
    environment:
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
      # Phase 1: validate tokens via the gateway -> identity-svc (overrides common.env).
      - AUTH_SERVICE_URL=http://gateway:8080/api/auth
      - WORKER_METRICS_PORT=9107
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      proxy:
        condition: service_healthy
    volumes:
      - ./logs/identity-svc:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  gateway:
    image: ghcr.io/craazzzyyfoxx/owt-gateway:${IMAGE_TAG:-latest}
    logging: *log-rotate
    # Single entry point for ALL REST + WS + JWT. 0.5 CPU here was the primary
    # ingress bottleneck (CFS throttling under load); give it headroom.
    deploy:
      resources:
        limits:
          cpus: '2.00'
          # 256M was hit during the 2026-09-30 homepage flood: in-flight
          # proxied requests to a saturated frontend pinned it at the limit.
          memory: 768M
        reservations:
          cpus: '0.50'
          memory: 128M
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file:
      - ./backend/env/common.env
      - ./backend/env/auth.env
      - ./backend/env/gateway.env
    environment:
      # Tag Sentry events as production (the DSN lives in backend/env/gateway.env).
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Ties events and OTel spans (service.version) to the deployed image.
      - SENTRY_RELEASE=gateway@${IMAGE_TAG:-latest}
      # Go's GC does not see the cgroup memory limit (GOMAXPROCS does track the
      # CPU limit since Go 1.25): without this the heap grows unchecked to the
      # 768M limit under a flood and the container is OOM-killed. ~85% of it.
      - GOMEMLIMIT=640MiB
      # OpenTelemetry tracing into Alloy (same block as the Python services),
      # so gateway spans join the distributed traces in Tempo and Sentry.
      - TRACING_ENABLED=${TRACING_ENABLED:-true}
      - OTLP_ENDPOINT=http://alloy:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
    volumes:
      # Structured JSON logs tailed by Promtail into Loki (LOG_FILE=/logs/gateway.log).
      # The distroless image runs as uid 65532 — ./logs/gateway must be writable by
      # it (deploy: mkdir -p logs/gateway && chmod 777 logs/gateway), else the
      # gateway falls back to stdout-only and logs won't reach Loki.
      - ./logs/gateway:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-svc:
        condition: service_healthy
    networks:
      - app-network
    # No healthcheck: the distroless image has no shell/wget. nginx depends on
    # it with condition: service_started.
    restart: always

  nginx:
    image: nginx:1.31-alpine
    logging: *log-rotate
    deploy:
      resources:
        limits:
          # nginx is the sole external edge and the rate-limit/conn-limit layer.
          # At 0.25 cpu it hits CFS throttling under a flood, i.e. the defence
          # fails before the thing it defends; limit_req/limit_conn shared zones
          # are also preallocated, so 64M cannot hold them plus body buffers.
          cpus: '1.00'
          # 256M OOM-killed workers in the 2026-09-30 homepage flood.
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 64M
    # Plain-HTTP app entry: TLS is terminated in front of nginx, outside this
    # stack, so no certs/443 here.
    # APP_BIND defaults to loopback: a bare "${APP_PORT}:80" binds 0.0.0.0, which
    # exposes nginx to the internet directly, bypassing the proxy in front and
    # its per-IP bans. Docker's published ports are NOT covered by ufw's filter
    # chains, so this must not rely on the host firewall alone. A proxy on the
    # same host reaches http://127.0.0.1:${APP_PORT}, so the default is exactly
    # right; override APP_BIND (e.g. to a bridge IP) only when the proxy in front
    # lives elsewhere. Client-IP spoofing is not possible on a direct path — a
    # public peer is not in set_real_ip_from — but the edge bans are bypassable.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Structured JSON access log + error log, tailed by Promtail into Loki
      # (promtail mounts ./logs as /var/log/app). Mounting over /var/log/nginx
      # replaces the image's stdout symlinks with real files, so `docker logs
      # nginx` goes quiet — Grafana is the consumer. Rotation is host-side and
      # must use copytruncate or follow up with `nginx -s reopen`.
      - ./logs/nginx:/var/log/nginx
    # NGINX_CONF_SHA comes from the Makefile: a changed nginx.conf changes this
    # label, which is what makes `make prod-up` recreate nginx onto the new file.
    labels:
      owt.nginx-conf-sha: "${NGINX_CONF_SHA:-}"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      # 127.0.0.1 (not localhost): in the container `localhost` resolves to ::1
      # first, but nginx `listen 80;` binds IPv4 only and busybox wget does not
      # fall back to IPv4 — so `localhost` made the probe fail (Connection
      # refused) and the container was always unhealthy.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  # ==========================================================================
  # Telemetry agent (profile `telemetry`). Scrapes this stack, tails ./logs,
  # receives OTLP from the services and pushes everything to the monitoring
  # stack on home (monitoring/README.md).
  #
  # Production enables the profile with COMPOSE_PROFILES=telemetry in the root
  # .env. The dev site on home runs this same file and leaves it off, so dev
  # telemetry never lands in production monitoring.
  #
  # Privileged, host PID and the host mounts are what the embedded unix
  # (node) exporter and cAdvisor need — the same access the standalone
  # node-exporter and cadvisor containers had. No ports are published; the UI
  # stays on 127.0.0.1:12345 inside the container.
  # ==========================================================================
  alloy:
    profiles: ["telemetry"]
    image: dockerhub.timeweb.cloud/grafana/alloy:v1.20.0
    logging: *log-rotate
    restart: unless-stopped
    user: "0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      TELEMETRY_INGEST_USER: "${TELEMETRY_INGEST_USER}"
      TELEMETRY_INGEST_PASSWORD: "${TELEMETRY_INGEST_PASSWORD}"
      SENTRY_OTLP_PUBLIC_KEY: "${SENTRY_OTLP_PUBLIC_KEY}"
      POSTGRES_EXPORTER_DSN: "${POSTGRES_EXPORTER_DSN}"
    volumes:
      - ./monitoring/alloy/moscow.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - ./logs:/var/log/app:ro
      - /:/host/root:ro,rslave
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      # The Docker host uses the containerd snapshotter: cAdvisor's docker
      # factory resolves containers through containerd and registers nothing
      # without this socket (zero per-container series).
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /dev/disk:/dev/disk:ro
    pid: host
    privileged: true
    devices:
      - /dev/kmsg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ALLOY_CONF_SHA comes from the Makefile, like nginx's: a changed
    # moscow.alloy makes `make prod-up` recreate the agent onto the new file.
    labels:
      owt.alloy-conf-sha: "${ALLOY_CONF_SHA:-}"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # nginx stub_status (internal :8081) -> connection counters. Alloy has no
  # embedded nginx exporter, so this 16 MB sidecar stays.
  nginx-exporter:
    profiles: ["telemetry"]
    image: dockerhub.timeweb.cloud/nginx/nginx-prometheus-exporter:1.5.3
    logging: *log-rotate
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  analytics-models:
  alloy-data:

networks:
  app-network:
    driver: bridge
