[project]
name = "stats-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cashews>=7.4.0",
    "faststream[rabbit,cli]>=0.6.7",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic[email]>=2.10.5",
    "redis>=5.2.1",
    "sqlalchemy>=2.1",
    "shared",
]


[tool.ty.environment]
python = "../.venv"
python-version = "3.14"
root = ["..", "."]

[tool.pytest.ini_options]
# One worker per CPU, a whole file per worker (tests in a file share module fixtures and tags). `-n 0` = serial.
addopts = "-n auto --dist loadfile"
