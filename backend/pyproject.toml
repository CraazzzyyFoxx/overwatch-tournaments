[tool.uv]
# faststream[cli] caps watchfiles<1.2, but only 1.3+ ships a cp315 (abi3) wheel;
# 1.1.x would need a Rust toolchain in every image (PyO3 0.26 rejects 3.15).
# Only the cli's `--reload` uses it (watchfiles.watch / DefaultFilter), stable API.
override-dependencies = ["watchfiles>=1.3.0"]
dev-dependencies = [
    "pytest>=7.4.3",
    "ruff>=0.2.2",
    "pre-commit>=3.6.2",
    "coverage>=7.4.3",
    "import-linter>=2.0",
    # Imported by tests only (stats-service/tests/test_tournament_logs_fanout.py); pinned by aio-pika.
    "aiormq>=7.2.5",
    # Runs the quota gate's Lua for real in unit tests: the all-or-nothing
    # two-scope charge is the one piece of this codebase that only a Redis
    # script interpreter can verify.
    "fakeredis[lua]>=2.38",
    # The type-check gate (scripts/typecheck.sh). Pinned: ty is pre-1.0 and its
    # diagnostics move between releases; bump on purpose, recalibrate ty-gate.toml.
    "ty==0.0.103",
]

[tool.uv.workspace]
members = ["shared", "app-service", "identity-service", "discord-service", "stats-service", "balancer-service", "tournament-service", "analytics-service", "stream-service"]

[tool.uv.sources]
shared = { workspace = true }

[tool.ty.environment]
# Editor config. The CI gate is ty-gate.toml (see scripts/typecheck.sh): with
# every service as a root at once, `src` resolves to the first service listed.
# Point ty at the workspace venv so it resolves `shared` (editable install)
# and all third-party packages.
python = ".venv"
python-version = "3.14"
# Roots for import resolution:
# - "." so `shared/` resolves as `shared`
# - each service dir so `from src.xxx` works inside that service
root = [
    ".",
    "app-service",
    "identity-service",
    "stats-service",
    "tournament-service",
    "balancer-service",
    "discord-service",
    "analytics-service",
    "stream-service",
]
extra-paths = [
    ".",
    "app-service",
    "identity-service",
    "stats-service",
    "tournament-service",
    "balancer-service",
    "discord-service",
    "analytics-service",
    "stream-service",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
#    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "F403", # 'from module import *' used; unable to detect undefined names
    "F405", # may be undefined, or defined from star imports (companion to F403; aggregators re-export via `*`)
    "UP046", # non-pep695 generic class — hold off on PEP 695 syntax (pydantic generics)
    "UP047", # non-pep695 generic function — hold off on PEP 695 syntax
    "UP042", # (str, Enum) -> StrEnum is an unsafe fix: str()/format() of members change; wire values may depend on it
]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately set env vars / sys.path before importing app code.
"**/tests/**" = ["E402"]
# Aggregator __init__.py files re-export via `*` in a hand-crafted dependency
# order (e.g. `hero` before `achievement`, which consumes `HeroRead`). Import
# sorting (I001) would reorder them alphabetically and break circular-import
# avoidance, and re-exports look like unused imports (F401).
"**/__init__.py" = ["I001", "F401"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.isort]
# Treat these as first-party so `shared.*` isn't grouped with stdlib/third-party.
known-first-party = ["shared", "src"]

[tool.coverage.run]
# Per-service suites run with --parallel-mode + --source, then `coverage combine`
# merges them. relative_files keeps paths portable across the matrix/checkout.
relative_files = true
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/migrations/*",
    "*/scripts/*",
]

[tool.coverage.report]
show_missing = false
