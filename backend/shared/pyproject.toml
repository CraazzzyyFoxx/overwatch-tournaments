[project]
name = "shared"
version = "0.1.0"
description = "Shared ORM models, schemas, clients, and utilities used across OWT services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # `asyncio` extra: SQLAlchemy 2.1 no longer installs greenlet by default. >=2.1 for
    # `Select.ext(postgresql.distinct_on(...))` (the old `.distinct(expr)` is deprecated).
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.10.5",
    "pydantic-core>=2.27.1",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "orjson>=3.10.14",
    # `socks` extra: the proxy sidecar (shared/core/config.py proxy_url) speaks SOCKS5, so every
    # httpx client built from it needs socksio; declared once here, not per service.
    "httpx[socks]>=0.28.1",
    # ASGI toolkit (NOT FastAPI): observability HTTP middleware + balancer's
    # multipart UploadFile reconstruction. Was transitively provided by fastapi
    # before its removal; declared explicitly now.
    "starlette>=0.40.0",
    "redis>=5.2.1",
    "cashews>=7.4.0",
    "tenacity>=9.0.0",
    # `cli` extra pulls in typer for the `faststream run serve:app` entrypoint every
    # worker uses. Was transitively provided by fastapi[standard] (fastapi-cli -> typer)
    # before its removal; declared explicitly now.
    "faststream[rabbit,cli]>=0.6.4",
    "aio-pika>=9.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    # Worker metrics (start_worker_metrics_server / balancer metrics). Was
    # transitively provided by prometheus-fastapi-instrumentator before its removal.
    "prometheus-client>=0.21.0",
    # FastStream `--reload` (dev compose) + discord's watchfiles command. Was
    # transitively provided by uvicorn[standard]/fastapi[standard]. Regular dep so
    # it lands in the `--no-dev` image used for the dev stack's hot-reload.
    "watchfiles>=0.24.0",
    # AES-GCM for OAuth provider tokens at rest (shared/core/secretbox.py, read by
    # identity and the services that check Twitch subscriptions).
    "cryptography>=44.0.0",
    # Imported by shared (S3 client, scheduler, Sentry init, OTel instrumentation); every service
    # needs them, so they are declared here once instead of in each service.
    "aiobotocore>=2.17.0",
    "botocore>=1.36.0",
    "apscheduler>=3.10.4",
    "sentry-sdk>=2.20.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    # `faststream run` picks it up when installed (faststream/_internal/cli/main.py).
    "uvloop; platform_system == 'Linux'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Treat this directory as the `shared` package itself.
# The parent folder is the project root; the package name is taken from `[project].name`.
packages = ["shared"]
package-dir = {"shared" = "."}

[tool.setuptools.package-data]
shared = ["**/*.py", "testing/test.env"]


[tool.ty.environment]
# Workspace folder `backend/shared` is its own ty project. `..` is first-party
# so `import shared.*` resolves (editable finder hook is invisible to ty).
python = "../.venv"
python-version = "3.14"
root = [".."]
