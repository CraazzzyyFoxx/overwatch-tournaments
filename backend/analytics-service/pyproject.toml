[project]
name = "analytics-service"
version = "0.1.0"
description = "Analytics service: OpenSkill/linear ratings and ML pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=2.17.0",
    "alembic>=1.14.0",
    "apscheduler>=3.10.4",
    "asyncpg>=0.30.0",
    "cashews>=7.4.0",
    "faststream[rabbit,cli]>=0.6.7",
    "httpx>=0.28.1",
    "socksio>=1.0.0",
    "loguru>=0.7.3",
    "numpy>=1.26.0",
    "openskill>=6.1.3",
    "orjson>=3.10.14",
    "pandas>=2.3.3",
    # ML stack (Phase 1+) — kept here so Docker builds for analytics-service
    # install them; not consumed by parser-service.
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    # CPU-only build: same `xgboost` module, a 5.6 MiB wheel instead of the
    # 125 MiB CUDA one plus its ~290 MiB nvidia-nccl dependency. Production is
    # GPU-less; analytics-worker.gpu.Dockerfile swaps the CUDA build back in.
    "xgboost-cpu>=3.2",
    "scipy>=1.13",
    "shap>=0.46",
    # Transitive dep of shap; numba<0.67 lacks a Python 3.14 build (its own
    # setup.py refuses to install rather than being absent a wheel), and its
    # PyPI metadata doesn't declare the cap, so the resolver can't see it.
    "numba>=0.67",
    "ruptures>=1.1",
    "statsmodels>=0.14",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.1",
    "pydantic[email]>=2.10.5",
    "redis>=5.2.1",
    "sentry-sdk>=2.20.0",
    "setuptools>=75.8.0",
    "sqlalchemy>=2.0.37",
    "sqlalchemy-utils>=0.41.2",
    "tenacity>=9.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "uvloop; platform_system == 'Linux'",
    "shared",
]


[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ty.environment]
python = "../.venv"
python-version = "3.14"
root = ["..", "."]
