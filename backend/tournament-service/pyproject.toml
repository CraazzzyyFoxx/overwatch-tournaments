[project]
name = "tournament-service"
version = "0.1.0"
description = "Tournament domain API and worker service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.10.4",
    "cashews>=7.4.0",
    "faststream[rabbit,cli]>=0.6.7",
    "loguru>=0.7.3",
    "pydantic[email]>=2.10.5",
    "redis>=5.2.1",
    "sqlalchemy>=2.1",
    "pydantic-core>=2.27.1",
    "shared",
    "httpx>=0.28.1",
]

[tool.ty.environment]
python = "../.venv"
python-version = "3.14"
root = ["..", "."]
