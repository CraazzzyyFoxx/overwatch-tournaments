[project]
name = "stream-service"
version = "0.1.0"
description = "Tournament stream live-status poller and rpc.stream.* read service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faststream[rabbit,cli]>=0.6.7",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic[email]>=2.10.5",
    "redis>=5.2.1",
    "sqlalchemy>=2.1",
    "prometheus-client>=0.21.0",
    "shared",
]

[tool.ty.environment]
python = "../.venv"
python-version = "3.14"
root = ["..", "."]
