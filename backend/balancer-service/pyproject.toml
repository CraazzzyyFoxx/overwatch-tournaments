[project]
name = "balancer-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# The native engines (``native/balancer_native``, a Rust crate, not a published
# package) are not a dependency here: the image builds them with maturin into a
# wheel of their own (see ``backend/Dockerfile``), locally ``maturin develop``.
dependencies = [
     "cashews>=7.4.0",
     "faststream[rabbit,cli]>=0.6.7",
     "loguru>=0.7.3",
     "maturin>=1.8.2",
     "openskill>=6.1.3",
     "orjson>=3.10.14",
     "pandas>=3.0",
     "pydantic-settings>=2.7.1",
     "pydantic[email]>=2.10.5",
     "redis>=5.2.1",
     "sqlalchemy>=2.1",
     "prometheus-client>=0.21.0",
    "starlette>=0.40.0",
    "annotated-types>=0.7.0",
    "shared",
]

[tool.ty.environment]
python = "../.venv"
python-version = "3.14"
root = ["..", "."]

[tool.pytest.ini_options]
# One worker per CPU, a whole file per worker (tests in a file share module fixtures and tags). `-n 0` = serial.
addopts = "-n auto --dist loadfile"
