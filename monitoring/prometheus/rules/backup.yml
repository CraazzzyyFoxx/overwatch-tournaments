groups:
  # Metrics come from ops/backup/backup.sh via the node-exporter textfile
  # collector (/var/lib/node_exporter/textfile/owt_backup.prom), so the job is `node`.
  #
  # Silence is a failure too. If cron did not fire (host reboot, docker down)
  # the metric stops updating — only an age check catches that.
  #
  # Cloud S3 already replicates; there is no second-site confirmation.
  - name: backup
    rules:
      - alert: BackupMissing
        # Daily cron (04:30 UTC); 30 hours = one miss plus slack.
        expr: |
          time() - max(owt_backup_last_success_timestamp_seconds) > 30 * 3600
          or absent(owt_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No Postgres dump for over 30 hours"
          description: >-
            owt_backup_last_success_timestamp_seconds has not updated in 30+ hours.
            Check: crontab -l; tail -n 100 /var/log/pg-backup.log.

      - alert: BackupRunFailed
        expr: max(owt_backup_last_status) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Last backup run failed"
          description: >-
            owt_backup_last_status=0. See /var/log/pg-backup.log.
            Previous success: {{ with query "max(owt_backup_last_success_timestamp_seconds)" }}{{ . | first | value | humanizeTimestamp }}{{ end }}.

      - alert: BackupDumpSuspiciouslySmall
        # A dump that suddenly halves in size is a silent broken dump
        # (wrong database, truncated pg_dump, empty schema) — not "a small backup".
        expr: |
          max(owt_backup_last_bytes) > 0
          and max(owt_backup_last_bytes) < 0.5 * max(max_over_time(owt_backup_last_bytes[14d]))
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Backup size dropped by more than half"
          description: >-
            This run uploaded {{ $value | humanize1024 }}B vs the 14-day maximum.
            Confirm the right database is dumped and pg_dump is not aborting.
