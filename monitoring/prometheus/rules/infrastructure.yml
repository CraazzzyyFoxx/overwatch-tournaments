groups:
  - name: scrape-targets
    interval: 30s
    rules:
      # Catch-all: any scrape target going dark. Gateway has its own dedicated
      # GatewayDown alert (critical); this one covers everything else.
      - alert: TargetDown
        expr: up{job!="gateway"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for 3 minutes."

  - name: host
    interval: 30s
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space below 15% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) has less than 15% free space."

      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space below 5% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) is almost full. Services will start failing (logs, Postgres, Docker)."

      - alert: HostMemoryHigh
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "The host has been using more than 90% of RAM for 10 minutes. OOM kills are likely next."

      # HostMemoryHigh waits 10 minutes; on 2026-09-30 available memory fell
      # from 3.3 GB to 0.96 GB in four, and swap was full a minute later. Normal
      # floor over the following days: 2.5 GB available (20%).
      - alert: HostMemoryCritical
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.12
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host available memory at {{ $value | humanizePercentage }}"
          description: "Less than 12% of RAM is available. Swap and OOM kills follow within minutes; find the container that is growing."

      # Baseline swap use is 0.3-0.9 GB of 4.3 GB. On 2026-09-30 it filled
      # completely in three minutes and SSH stopped answering.
      - alert: HostSwapFilling
        expr: |
          (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.5
          and node_memory_SwapTotal_bytes > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host swap {{ $value | humanizePercentage }} full"
          description: "The host is swapping hard; everything slows down, SSH included. Free memory before it fills."

      # /proc/vmstat oom_kill counts every kernel OOM kill, cgroup-limited
      # container kills included (gateway and nginx on 2026-09-30).
      - alert: OomKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Kernel OOM-killed {{ $value | printf \"%.0f\" }} process(es) in 5 minutes"
          description: "A container hit its memory limit (or the host ran out). `dmesg | grep -i oom` names the process and its cgroup."

      - alert: HostCpuHigh
        expr: |
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 90%"
          description: "Average CPU usage across all cores has exceeded 90% for 15 minutes."

      # PSI "full": all non-idle tasks stalled on I/O at once. On 2026-09-26 the
      # virtual disk stopped completing I/O and the host hung minutes later;
      # this is the early signal while the host can still push metrics.
      - alert: HostIOPressureHigh
        expr: rate(node_pressure_io_stalled_seconds_total[2m]) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host I/O pressure above 30%"
          description: "Tasks were fully stalled on I/O more than 30% of the time for 2 minutes. The disk is degrading; a full hang (ProdTelemetryAbsent) may follow."

  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "postgres-exporter cannot connect to PostgreSQL. Check the database and POSTGRES_EXPORTER_DSN (must point at Postgres :5432, not pgBouncer :6432)."

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) > 0.8 * sum(pg_settings_max_connections)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value }} active connections. New connections will start being rejected at max_connections."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected in {{ $labels.datname }}"
          description: "{{ $value }} deadlocks in the last 10 minutes in database {{ $labels.datname }}."
