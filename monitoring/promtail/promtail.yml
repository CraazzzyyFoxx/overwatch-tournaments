# Local dev stack only (docker-compose.yml). Production ships logs with Alloy:
# the same pipelines live in monitoring/alloy/moscow.alloy — keep them in step.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # --------------------------------------------------------------------------
  # Scrape all service log files from the mounted host logs directory.
  # Expected layout: /var/log/app/<service-name>/<service-name>.log
  # --------------------------------------------------------------------------
  - job_name: app_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: app_services
          __path__: /var/log/app/**/*.log
          # The Go gateway emits flat slog JSON (not Loguru's nested shape) and
          # nginx emits its own edge_json shape; both are parsed by the dedicated
          # jobs below, so exclude them here.
          __path_exclude__: /var/log/app/{gateway,nginx}/*.log

    pipeline_stages:
      # Parse the JSON log lines emitted by Loguru with serialize=True
      - json:
          expressions:
            level: record.level.name
            service: record.extra.service
            status: record.extra.status
            queue: record.extra.queue
            handler: record.extra.handler
            trace_id: record.extra.trace_id
            span_id: record.extra.span_id
            trace_sampled: record.extra.trace_sampled
            message_id: record.extra.message_id
            job_id: record.extra.job_id
            message: record.message
            correlation_id: record.extra.correlation_id
            timestamp: record.time.timestamp

      # Promote parsed fields to Loki labels
      - labels:
          level:
          service:
          status:
          queue:
          handler:
          trace_sampled:

      # Use the log record's own timestamp (epoch float) as the Loki timestamp
      - timestamp:
          source: timestamp
          format: Unix

      # Drop health check poll noise from Loki to keep log volume down
      - drop:
          source: message
          expression: "GET /health"

  # --------------------------------------------------------------------------
  # Go gateway — flat slog JSON (keys: level, msg, time, service, status,
  # correlation_id, trace_id, route, ...). Different shape from the Loguru
  # services above, so it gets its own pipeline.
  # --------------------------------------------------------------------------
  - job_name: gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway
          __path__: /var/log/app/gateway/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            status: status
            message: msg
            correlation_id: correlation_id
            trace_id: trace_id
            route: route
            timestamp: time
      - labels:
          level:
          service:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - drop:
          source: message
          expression: "GET /health"

  # --------------------------------------------------------------------------
  # nginx edge — the `edge_json` log_format from nginx/nginx.conf. `limit_req` /
  # `limit_conn` carry the rate-limit outcome (PASSED / REJECTED /
  # REJECTED_DRY_RUN) and are the primary signal for calibrating and then
  # enforcing the DoS limits — see
  # docs/superpowers/specs/2026-08-06-nginx-dos-hardening-design.md.
  #
  # error.log is plain text, not JSON: the json stage leaves its fields empty and
  # the line is still shipped, which is what we want for the modules' own
  # "limiting requests" / "limiting connections" warnings.
  # --------------------------------------------------------------------------
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/app/nginx/*.log

    pipeline_stages:
      - json:
          expressions:
            status: status
            uri: uri
            method: method
            remote_addr: remote_addr
            limit_req: limit_req
            limit_conn: limit_conn
            timestamp: time

      # status/limit_* are low-cardinality and are what the alerts group by.
      # remote_addr and uri stay as log content, NOT labels — either would blow
      # up Loki's index, and the attacker controls both.
      - labels:
          status:
          limit_req:
          limit_conn:

      - timestamp:
          source: timestamp
          format: RFC3339

      # Container healthcheck polls /health every 30s; same noise drop as the
      # other jobs.
      - drop:
          source: uri
          expression: "^/health$"

      # Turn the rate-limit outcome into Prometheus counters on promtail:9080.
      # Grafana alerting is not provisioned as code in this repo (only
      # dashboards + datasources), so a Loki-only alert would live outside git.
      # Exposing counters here keeps the alert a plain Prometheus rule
      # (monitoring/prometheus/rules/nginx.yml).
      #
      # During rollout phase 1 (limit_req_dry_run on) only the _dry_run counter
      # moves — that is the calibration signal. After enforcement the other one
      # takes over; both are kept so flipping dry_run needs no dashboard edits.
      - metrics:
          nginx_limit_req_rejected_total:
            type: Counter
            description: "Requests rejected by an nginx limit_req zone"
            source: limit_req
            config:
              action: inc
              value: REJECTED
          nginx_limit_req_rejected_dry_run_total:
            type: Counter
            description: "Requests an nginx limit_req zone would have rejected (dry run)"
            source: limit_req
            config:
              action: inc
              value: REJECTED_DRY_RUN
          nginx_limit_conn_rejected_total:
            type: Counter
            description: "Requests rejected by an nginx limit_conn zone"
            source: limit_conn
            config:
              action: inc
              value: REJECTED
          nginx_limit_conn_rejected_dry_run_total:
            type: Counter
            description: "Requests an nginx limit_conn zone would have rejected (dry run)"
            source: limit_conn
            config:
              action: inc
              value: REJECTED_DRY_RUN