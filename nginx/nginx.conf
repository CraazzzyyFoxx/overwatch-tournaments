# Application entry reverse-proxy: the app's internal HTTP edge.
#
# Routing is by path. The API surface — /api/*, the WebSocket endpoints and
# /health — goes to the Go gateway (REST + WS hub). Everything else (pages,
# /_next assets, the frontend's own /bff/* and /auth/* route handlers, and
# /api/health) goes straight to the Next.js frontend; the gateway never sees
# frontend traffic.
# TLS is NOT terminated here — the proxy in front of nginx handles certificates.
# nginx serves plain HTTP and forwards the original scheme / host / client IP it
# receives from that proxy.
#
# DoS posture: see docs/superpowers/specs/2026-08-06-nginx-dos-hardening-design.md
# for the threat model, the reasoning behind every number below, and the phased
# rollout. nginx speaks only HTTP/1.1 —
# there is no HTTP/2 attack surface (HPACK bomb, Rapid Reset) at all, and
# L3/L4 volumetric attacks belong to the hosting provider, not to anything
# configured here.

worker_processes auto;
# worker_processes (auto = one per core) x worker_connections, plus log/proxy
# file descriptors. Without this the limiter can be defeated by simply running
# nginx out of descriptors before any zone is consulted.
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile   on;
    tcp_nopush on;
    # Don't advertise the exact nginx version in responses and error pages.
    server_tokens off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Recover the real client IP from behind the proxy in front.
    #
    # That proxy terminates TLS and reaches us over the published host port, so
    # the peer nginx actually connects with ($remote_addr) is a docker-network
    # hop (the bridge gateway, e.g. 172.x), NOT the client. The proxy forwards
    # the true client in X-Forwarded-For. Without realip, $remote_addr —
    # and therefore the X-Real-IP / X-Forwarded-For we send upstream, the
    # $remote_addr in the access log, AND every rate-limit key below — all
    # collapse to that docker hop, so every login/oauth session records the same
    # local IP. Trust only private (RFC1918 + loopback) hops as proxies: a real
    # client's public IP is never trusted, so it can't be spoofed away, while any
    # front proxy on the internal network is transparently unwound. real_ip_recursive
    # walks the XFF chain right-to-left, skipping trusted hops, to the first public
    # address — the client the front proxy saw.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------------------
    # Rate-limit whitelist: internal networks and loopback.
    #
    # nginx does not account a request whose zone key is EMPTY, so mapping a
    # source to "" is the documented way to exempt it — no `if`, no duplicated
    # locations. This covers the container healthcheck (127.0.0.1) and any
    # service-to-service call that reaches nginx over the compose network.
    #
    # geo reads $remote_addr, and realip (POST_READ phase) has already rewritten
    # it by the time the limit modules evaluate the key (PREACCESS phase), so
    # this matches the true client, not the docker hop.
    #
    # This cannot be spoofed into: to land in the exempt branch $remote_addr must
    # be private, and real_ip_recursive stops at the first UNTRUSTED hop. The
    # front proxy overwrites X-Forwarded-For with the address it saw; were one to
    # append instead, `X-Forwarded-For: 10.0.0.1` would become "10.0.0.1, <its own
    # public IP>", which still resolves to its own public IP.
    # ------------------------------------------------------------------------
    geo $limit_exempt {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.1      1;
    }
    map $limit_exempt $limit_key {
        0 $binary_remote_addr;
        1 "";
    }

    # Hashed Next chunks and the image optimizer are not an L7 flood vector.
    # A 429 on `/_next/static/*.css` leaves the visitor with a bare HTML
    # document — the failure mode on a shared NAT / throttled last-mile.
    # Empty key = this request does not consume the req_edge budget.
    map $uri $req_edge_key {
        ~*^/_next/static/ "";
        ~*^/_next/image   "";
        default           $limit_key;
    }

    # ------------------------------------------------------------------------
    # Rate-limit zones (per client IP).
    #
    # req_edge is ONE shared budget for ordinary traffic — pages and API calls
    # come from the same visitor, so splitting their budgets would model reality
    # wrongly and cost another preallocated zone. The other zones exist because
    # their traffic is qualitatively different, not merely busier.
    #
    # Zones are preallocated shared memory: ~27 MB total here. The nginx
    # container's memory limit must accommodate that (see docker-compose*.yml).
    # Capacity is roughly 16k states/MB for limit_req and 32k for limit_conn,
    # i.e. req_edge tracks ~128k distinct client IPs before LRU eviction.
    # ------------------------------------------------------------------------
    limit_req_zone  $req_edge_key zone=req_edge:8m   rate=40r/s;
    limit_req_zone  $limit_key zone=req_auth:4m   rate=10r/s;
    limit_req_zone  $limit_key zone=req_ws:2m     rate=1r/s;
    limit_req_zone  $limit_key zone=req_upload:1m rate=10r/m;
    # 2026-09-30: an L7 flood on "/" (~75 r/s spread over many IPs, each under
    # req_edge) saturated every frontend replica. A human loads the homepage
    # document a few times a minute, not every second.
    limit_req_zone  $limit_key zone=req_home:4m   rate=1r/s;
    # inactive=10m: an entry outlives its 30s freshness so proxy_cache_use_stale
    # can keep serving the homepage while the frontend is down.
    proxy_cache_path /var/cache/nginx/home levels=1 keys_zone=home:2m max_size=50m inactive=10m use_temp_path=off;
    # OpenGraph cards (frontend/src/lib/og, users/[slug]/opengraph-image). A
    # Discord notification makes Discordbot fetch the same card ~30 times
    # within seconds; each render is a Satori + resvg pass on the frontend's
    # one event loop, so the burst took 1.5-4 s per card, Discordbot gave up
    # (499) and retried, and every replica's RSS stepped up ~250 MB for good
    # (2026-10-04, encounters 6655-6664). inactive=1h keeps a stale copy for
    # proxy_cache_use_stale.
    proxy_cache_path /var/cache/nginx/og levels=1 keys_zone=og:1m max_size=100m inactive=1h use_temp_path=off;
    # A signed-in viewer may see a hidden tournament's card; never store or
    # serve a cached copy for them.
    map "$owt_home_authed:$http_authorization" $owt_og_nocache {
        default 1;
        "0:"    0;
    }

    # Homepage cache for signed-out visitors (docs/incidents/2026-09-30). "/" is
    # force-dynamic, but for an anonymous visitor its HTML depends only on what
    # these maps extract: host (tenant vs platform), the locale cookie, the first
    # Accept-Language tag (locale fallback and date format), the time-zone
    # cookie, the workspace cookie, cookie consent and dismissed announcements.
    # Each value is held to its real shape, which bounds an entry's size but
    # not the number of entries: a client can still mint keys (any language
    # tag, workspace id or time zone of the right shape), and the session-cookie
    # test below checks presence, not validity. That is what the `frontend_home`
    # upstream cap is for. Signed-in visitors (session cookie) and RSC fetches
    # bypass the cache: those responses can differ per viewer.
    #
    # The query string is neither in the key nor a bypass. The page reads no
    # searchParams on the server; the `/?login=1`, `/?auth_error=…` and
    # `/?settings=…` handoffs are read in client effects from the browser's own
    # URL. A cacheable request therefore reaches the frontend as a bare "/"
    # (see $owt_home_upstream_uri), the same document Next serves a static page
    # for any query, so one cached copy is right for every query string.
    # Before 2026-10, `/?<random>` bypassed the cache and went straight to SSR.
    map $http_cookie $owt_home_authed {
        default 0;
        "~(?:^|;\s*)(?:owt|owtdev|aqt)_(?:access|refresh)_token=" 1;
    }
    map "$owt_home_authed:$http_rsc:$http_authorization" $owt_home_nocache {
        default 1;
        "0::"   0;
    }
    map $owt_home_nocache $owt_home_upstream_uri {
        0       /;
        default $request_uri;
    }
    map $http_accept_language $owt_home_lang {
        default "";
        "~^\s*(?<owt_hl_lang>[A-Za-z]{2,3}(?:-[A-Za-z]{2,4})?)\s*(?:[,;]|$)" $owt_hl_lang;
    }
    map $cookie_NEXT_LOCALE $owt_home_locale {
        default "";
        en      en;
        ru      ru;
    }
    map $cookie_NEXT_TIMEZONE $owt_home_tz {
        default "";
        "~^(?<owt_hl_tz>[A-Za-z_]+(?:(?:/|%2F)[A-Za-z0-9_+-]+){1,2})$" $owt_hl_tz;
    }
    map $http_cookie $owt_home_ws {
        default "";
        "~(?:^|;\s*)owt-workspace-id=(?<owt_hl_ws>\d{1,10})(?:;|$)" $owt_hl_ws;
    }
    map $http_cookie $owt_home_ws_legacy {
        default "";
        "~(?:^|;\s*)aqt-workspace-id=(?<owt_hl_wsl>\d{1,10})(?:;|$)" $owt_hl_wsl;
    }
    map $http_cookie $owt_home_consent {
        default "";
        "~(?:^|;\s*)owt-cookie-consent=(?<owt_hl_consent>accepted|declined)(?:;|$)" $owt_hl_consent;
    }
    map $http_cookie $owt_home_dismissed {
        default "";
        "~(?:^|;\s*)owt-announcement-dismissed=(?<owt_hl_ids>[0-9.]{1,600})(?:;|$)" $owt_hl_ids;
    }

    # limit_conn counts connections whose header has been read and whose request
    # is being processed — i.e. concurrent in-flight requests, which is exactly
    # right behind the front proxy's keepalive connection pool. For the WebSocket
    # locations the request lives as long as the socket, so conn_ws really does
    # count live sockets.
    limit_conn_zone $limit_key zone=conn_edge:8m;
    limit_conn_zone $limit_key zone=conn_ws:4m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # ROLLOUT PHASE 3 — ENFORCING. Phase 1 ran dry-run from 2026-08-06 and the
    # calibration window (2026-08-06..08-12, 499_416 requests, 1738 distinct
    # client IPs, busiest day 99_724) produced exactly ZERO legitimate
    # rejections: the only 514 REJECTED_DRY_RUN entries all came from the host's
    # own public IP (hairpinned, hence outside the RFC1918 exemption above) in a
    # two-second locust burst against a mistyped /api/v1/health, and limit_conn
    # never rejected anything at all. Measured per-IP peaks against the zones:
    # req_edge 67 r/s, req_auth 8 r/s, req_ws 4 r/s (15/min), upload paths unused.
    # Re-enable dry-run (both `on`) before widening any zone rather than guessing.
    limit_req_dry_run  off;
    limit_conn_dry_run off;

    # ------------------------------------------------------------------------
    # Access log.
    #
    # $uri, NOT $request: the WebSocket endpoint carries the JWT as ?token=...,
    # and $request would include the query string. Logging the method plus the
    # normalized path keeps tokens out of the logs — do not "fix" this to
    # $request.
    #
    # JSON so promtail can label on status / limit outcome without regex. Writes
    # to a real file (bind-mounted to ./logs/nginx, tailed by promtail into Loki)
    # instead of the image's default stdout symlink — same pattern as every other
    # service in the stack. Rotation is host-side; a rotator must use
    # copytruncate or follow up with `nginx -s reopen`.
    # ------------------------------------------------------------------------
    log_format edge_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"ua":"$http_user_agent",'
        '"ref":"$http_referer",'
        '"limit_req":"$limit_req_status",'
        '"limit_conn":"$limit_conn_status"'
    '}';
    access_log /var/log/nginx/access.log edge_json;
    # warn so the limit modules' "limiting requests"/"limiting connections"
    # messages reach Loki alongside the structured access log.
    error_log  /var/log/nginx/error.log warn;

    # WebSocket upgrade plumbing: echoes the Upgrade header, or "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the original scheme from the TLS terminator. Falls back
    # to nginx's own scheme if nothing upstream set the header.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # /bff/* is the frontend's cookie-authenticated surface (account settings,
    # API keys): as viewer-dependent as the API, so a response that carries no
    # Cache-Control of its own gets `private, no-store` — an absent header
    # invites heuristic caching by intermediaries. An explicit upstream value
    # wins. Evaluated lazily, at response time, so the upstream header is set.
    map $upstream_http_cache_control $bff_cache_control {
        ""      "private, no-store";
        default $upstream_http_cache_control;
    }

    # Re-resolve the gateway / frontend container IPs at runtime via Docker's
    # embedded DNS. Recreating a container gives it a new IP; with an IP cached
    # at config load nginx returned 502 until it was restarted. A variable in
    # proxy_pass (below) forces per-request resolution honoring this resolver's
    # TTL; the `frontend_home` upstream gets the same through `server ...
    # resolve`. A name with several A records — the frontend under
    # `docker compose --scale frontend=N` — is round-robined across all of them,
    # with a failed peer retried on the next (proxy_next_upstream default).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Homepage renders only (`location = /`). The per-IP limits cannot stop a
    # flood spread over thousands of addresses, and every way past the home
    # cache (a minted key, a fake session cookie, an RSC header) ends in a full
    # SSR render on the frontend's one event loop. max_conns caps how many of
    # those run at once per frontend replica, so a flood on "/" can saturate
    # this budget but never the frontend that serves every other page. Over the
    # cap nginx has no live peer: a cached copy is served stale (use_stale
    # `error` covers it), anything uncached gets a fast 502 instead of a queue.
    # `resolve` keeps the runtime re-resolution of the `$frontend_upstream`
    # locations (OSS nginx >= 1.27.3), one peer per replica under --scale.
    # max_fails=0: the shared zone would otherwise remember one failed connect
    # and sideline a replica for fail_timeout, which the per-request variable
    # upstreams never did; max_conns is the only limit wanted here.
    upstream frontend_home {
        zone frontend_home 64k;
        server frontend:3000 resolve max_conns=16 max_fails=0;
    }

    # Metrics surface for nginx-prometheus-exporter. Not published to the host in
    # any compose file, so it is reachable only over the internal app-network —
    # same containment as the gateway's :9110. The allow/deny is defence in depth
    # in case the port is ever published by mistake.
    server {
        listen 8081;
        access_log off;

        location = /stub_status {
            stub_status;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name _;

        # Bound the request body by default; large upload endpoints raise it below.
        # Aligns with the gateway/edge 12 MiB in-memory body cap.
        client_max_body_size 12m;

        # Anti-slowloris. These were all nginx defaults (60s header, 60s body,
        # 75s keepalive), which let a trickling client hold a worker slot for a
        # minute per phase at negligible cost to itself. client_body_timeout is
        # between successive read operations, not a total budget, so it does not
        # cap legitimate large uploads (which additionally get 30s below).
        # reset_timedout_connection sends RST instead of entering FIN_WAIT, so a
        # timed-out flood releases memory immediately.
        client_header_timeout 10s;
        client_body_timeout   15s;
        # 15s aborted writes to a throttled last-mile mid-document (bare HTML).
        # 60s is nginx's default and still bounds a slowloris sender.
        send_timeout          60s;
        keepalive_timeout     30s;
        keepalive_requests    500;
        reset_timedout_connection on;

        # Shared per-IP budget for ordinary traffic. The sustained 40r/s ceiling is
        # roughly 10x an actively browsing human; burst absorbs the page-load spike
        # on top of it.
        #
        # burst 120, not the 80 this shipped with: the calibration window measured a
        # legitimate peak of 67 requests in one second from a single IP (a heavy page
        # load), which 80 clears by only ~1.8x once enforcement is real. 120 keeps a
        # spike that is half again heavier than anything observed out of the 429 path
        # while leaving the sustained rate — the part that actually bounds a flood —
        # untouched. Burst costs no zone memory; only the rate does the limiting.
        #
        # nodelay everywhere: the default (queue and delay) holds the connection
        # open while the request waits, which under a flood works FOR the attacker.
        # An immediate 429 is the cheap answer.
        limit_req  zone=req_edge burst=120 nodelay;
        # Concurrent in-flight requests per IP. A browser never has 100 outstanding
        # requests against one origin; the WS locations below opt out of this zone
        # deliberately (see there).
        limit_conn conn_edge 100;

        # Hostnames in variables → nginx resolves them per request (see resolver
        # above), so a recreated gateway or frontend container is picked up
        # without an nginx restart.
        set $gateway_upstream  gateway;
        set $frontend_upstream frontend;

        # Shared proxy config, inherited by every location that does not define its
        # own proxy_set_header (none below do). proxy_pass stays per-location
        # because it uses the runtime-resolved upstream variables.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Server-authored scoping headers: frontend/src/proxy.ts sets them per
        # request (and deletes before setting). Dropping any client-supplied copy
        # here keeps the edge an independent second barrier. nginx cannot strip a
        # header prefix, so a new x-owt-* header must be added to this list.
        proxy_set_header X-Owt-Workspace-Id "";
        proxy_set_header X-Owt-Host-Mode    "";
        proxy_set_header X-Owt-Pathname     "";
        proxy_buffering off;
        # NOTE: proxy_buffering is about RESPONSES. proxy_request_buffering stays
        # at its default (on), so a slow request body is absorbed by nginx and
        # never occupies a gateway goroutine — do not disable it.
        #
        # Bounded upstream timeouts (was 3600s on every request). 180s leaves
        # margin over the gateway's 120s RPC ceiling for the slowest cold-cache
        # reads. The long-lived WebSocket endpoints override these below.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # WebSocket endpoints: keep the long timeout so idle live connections and
        # long balancer streams are not cut off. proxy_read_timeout does not accept
        # a variable, so these get their own exact-match locations.
        #
        # limit_req/limit_conn are NOT inherited once declared at this level, so
        # req_edge is repeated explicitly — otherwise WS handshakes would escape
        # the shared budget entirely.
        #
        # conn_ws 128 is deliberately ABOVE the gateway's
        # GATEWAY_WS_MAX_ANON_CONNS_PER_IP=64: for anonymous sockets the gateway's
        # smarter, auth-aware counter stays the binding limit, while this closes
        # the gap the gateway leaves open — authenticated WS connections are
        # capped per IP nowhere else. Shared NATs make a low value dangerous.
        #
        # req_ws allows 10 instant handshakes then 1/s, which covers a multi-tab
        # reconnect storm while cutting a connect/disconnect loop.
        location = /ws {
            limit_req  zone=req_edge burst=120 nodelay;
            limit_req  zone=req_ws   burst=10 nodelay;
            limit_conn conn_ws 128;
            # send_timeout only applies during an active write, so it never fires
            # on an idle tunnel — but 15s is too tight for a burst of messages to
            # a slow client.
            send_timeout       3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://$gateway_upstream:8080;
        }
        location = /api/realtime/ws {
            limit_req  zone=req_edge burst=120 nodelay;
            limit_req  zone=req_ws   burst=10 nodelay;
            limit_conn conn_ws 128;
            send_timeout       3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://$gateway_upstream:8080;
        }
        # Canonical spelling of the same socket. The two above are the legacy
        # ones the gateway still answers (cmd/gateway/main.go registers all
        # three); this is the one clients should open. Without its own location
        # it would inherit the 180s read timeout and cut every live connection.
        location = /api/v1/realtime/ws {
            limit_req  zone=req_edge burst=120 nodelay;
            limit_req  zone=req_ws   burst=10 nodelay;
            limit_conn conn_ws 128;
            send_timeout       3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://$gateway_upstream:8080;
        }

        # Auth endpoints: coarse anti-brute-force limit on top of the shared
        # budget. Defense-in-depth to the gateway's own per-IP token bucket, which
        # does the subtle part (on /refresh it meters only 401/403 responses, so a
        # shared NAT's ordinary token rotations can't log everyone out).
        #
        # Three locations, one policy: identity moved inside the version
        # (/api/v1/auth/login), the pre-unification spelling is still answered
        # until its Sunset, and /api/v2 is the same handlers with a different
        # envelope. A login path that missed this zone would be the whole point
        # of the zone, missed — so each spelling is listed rather than left to
        # inherit the generic /api budget.
        location /api/v1/auth/ {
            limit_req zone=req_edge burst=120 nodelay;
            limit_req zone=req_auth burst=20 nodelay;
            proxy_pass http://$gateway_upstream:8080;
        }
        location /api/v2/auth/ {
            limit_req zone=req_edge burst=120 nodelay;
            limit_req zone=req_auth burst=20 nodelay;
            proxy_pass http://$gateway_upstream:8080;
        }
        location /api/auth/ {
            limit_req zone=req_edge burst=120 nodelay;
            limit_req zone=req_auth burst=20 nodelay;
            proxy_pass http://$gateway_upstream:8080;
        }

        # Match-log / balancer-export uploads legitimately exceed the default body
        # cap (parser accepts up to 50 MiB); raise it just for these two paths.
        # A 60 MB body is the most expensive request the edge accepts, so these
        # keep the tightest rate and concurrency of anything here.
        #
        # burst 10, not 5: these two paths saw ZERO traffic across the whole
        # calibration window, so unlike every other zone their limit was never
        # exercised by a real user — and the cost of guessing low is an admin who
        # cannot upload a match's logs. 10 instant uploads then one per 6s still
        # bounds the amplification vector; the sustained 10r/m is what matters.
        location = /api/v1/admin/logs/upload {
            client_max_body_size 60m;
            client_body_timeout  30s;
            limit_req  zone=req_edge   burst=120 nodelay;
            limit_req  zone=req_upload burst=10  nodelay;
            limit_conn conn_edge 2;
            proxy_pass http://$gateway_upstream:8080;
        }
        location = /api/v1/teams/create/balancer {
            client_max_body_size 60m;
            client_body_timeout  30s;
            limit_req  zone=req_edge   burst=120 nodelay;
            limit_req  zone=req_upload burst=10  nodelay;
            limit_conn conn_edge 2;
            proxy_pass http://$gateway_upstream:8080;
        }
        location = /api/v2/admin/logs/upload {
            client_max_body_size 60m;
            client_body_timeout  30s;
            limit_req  zone=req_edge   burst=120 nodelay;
            limit_req  zone=req_upload burst=10  nodelay;
            limit_conn conn_edge 2;
            proxy_pass http://$gateway_upstream:8080;
        }
        location = /api/v2/teams/create/balancer {
            client_max_body_size 60m;
            client_body_timeout  30s;
            limit_req  zone=req_edge   burst=120 nodelay;
            limit_req  zone=req_upload burst=10  nodelay;
            limit_conn conn_edge 2;
            proxy_pass http://$gateway_upstream:8080;
        }

        # Gateway: the whole API namespace — /api/v{n}, the legacy /api/<domain>
        # spellings and the docs (/api/docs, /api/openapi*.json). The gateway
        # answers anything outside its route table with a JSON 404.
        location /api/ {
            proxy_pass http://$gateway_upstream:8080;
        }
        # Gateway liveness; the nginx container healthcheck probes it.
        location = /health {
            proxy_pass http://$gateway_upstream:8080;
        }

        # The one /api path the gateway does not own: the frontend container's
        # probe, a Next route handler (frontend/src/app/api/health).
        location = /api/health {
            proxy_pass http://$frontend_upstream:3000;
        }
        location /bff/ {
            proxy_hide_header Cache-Control;
            add_header Cache-Control $bff_cache_control always;
            proxy_pass http://$frontend_upstream:3000;
        }

        # Homepage: flood guard (req_home) plus a 30s cache for signed-out
        # visitors (see the owt_home_* maps). Stale copies are served while a
        # refresh is in flight and while the frontend errors, so a flood or a
        # frontend restart never reaches visitors as a blank page. A response
        # that sets a cookie is never stored (Set-Cookie is still honoured).
        # X-Cache-Status (HIT/MISS/STALE/UPDATING/BYPASS) makes it observable.
        # Renders go through `frontend_home`, capped per replica (see there); a
        # cacheable request is sent upstream as a bare "/" (see the maps).
        location = / {
            limit_req  zone=req_edge burst=120 nodelay;
            limit_req  zone=req_home burst=10  nodelay;
            limit_conn conn_edge 100;
            proxy_buffering on;
            proxy_cache home;
            proxy_cache_key "$forwarded_proto://$host/|$owt_home_lang|$owt_home_locale|$owt_home_tz|$owt_home_ws|$owt_home_ws_legacy|$owt_home_consent|$owt_home_dismissed";
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_bypass $owt_home_nocache;
            proxy_no_cache $owt_home_nocache;
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://frontend_home$owt_home_upstream_uri;
        }

        # OpenGraph cards (see the `og` cache zone): one render per card and
        # locale per 10 minutes, and the burst waits on that one render instead
        # of starting its own. The `?v=` content hash is part of the key, so a
        # changed card is a new entry. The frontend answers max-age=0, hence
        # proxy_ignore_headers. proxy_ignore_client_abort: Discordbot gives up
        # after ~1.8 s; the render must still finish and land in the cache.
        location ~ ^/(?:encounters/[0-9]+/og|.+/opengraph-image(?:-[0-9a-z]+)?)$ {
            proxy_buffering on;
            proxy_cache og;
            proxy_cache_key "$forwarded_proto://$host$uri$is_args$args|$owt_home_lang|$owt_home_locale|$owt_home_tz";
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 15s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_bypass $owt_og_nocache;
            proxy_no_cache $owt_og_nocache;
            proxy_ignore_headers Cache-Control Expires;
            proxy_ignore_client_abort on;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://$frontend_upstream:3000;
        }

        # Everything else is the frontend. With no URI after the port, the
        # original request URI (incl. query string) is passed through unchanged.
        location / {
            proxy_pass http://$frontend_upstream:3000;
        }
    }
}
