name: owt-monitoring

# ==============================================================================
# System monitoring stack: Prometheus + Alertmanager + Loki + Promtail +
# Tempo + OpenTelemetry Collector + Grafana + exporters.
#
# Runs as its own Compose project (`owt-monitoring`) and attaches to the
# production stack's network so scrape targets (gateway:9110, redis:6379,
# rabbitmq:15672, workers, ...) resolve by service name.
#
# PREREQUISITE: the production stack must be up first so the external network
# `owt_app-network` exists. Run `make prod-up` before
# `make monitoring-up`.
# ==============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 450MiB
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      # Tempo's metrics_generator pushes span-metrics / service-graph series here.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    depends_on:
      - redis-exporter
      - rabbitmq-exporter
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 192M

  alertmanager:
    # v0.28+ is REQUIRED: v0.27.0 parses `webhook_url_file` in discord_configs but
    # its receiver validation still demands `webhook_url`, so a file-backed Discord
    # webhook fails config load with "no discord webhook URL provided".
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/run/secrets:ro
      - alertmanager_data:/alertmanager
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:1.0.0-RC19
    restart: unless-stopped
    environment:
      RABBIT_URL: "http://rabbitmq:15672"
      # Same variable names as the broker in docker-compose.production.yml — one
      # source of truth in .env. (Previously RABBITMQ_USER/RABBITMQ_PASSWORD,
      # which nothing set, so the exporter silently fell back to guest/guest.)
      RABBIT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBIT_PASSWORD: "${RABBITMQ_DEFAULT_PASS:-guest}"
      RABBIT_CAPABILITIES: "bert,no_sort"
      PUBLISH_PORT: "9419"
      OUTPUT_FORMAT: "TTY"
      SKIP_QUEUES: "^$"
      INCLUDE_QUEUES: ".*"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  # nginx edge — connection/request counters from the internal stub_status
  # endpoint (nginx :8081, not published to the host). stub_status carries no
  # per-status counters, so 429 rates come from the `nginx` job in Loki; this
  # exporter covers saturation and slowloris signals
  # (nginx_connections_{active,reading,writing,waiting}).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M

  # Host-level metrics (CPU / memory / disk / network). Reads the host via
  # bind-mounts; no ports published — scraped over the compose network.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      # Textfile collector: сюда ops/backup/backup.sh пишет owt_backup.prom
      # (rustfs своего Prometheus-эндпоинта не имеет, а /rustfs/admin/v3/metrics
      # отдаёт NDJSON и требует подписи SigV4). Каталог читается через уже
      # смонтированный ro-rootfs, поэтому путь с префиксом /host.
      - "--collector.textfile.directory=/host/var/lib/node_exporter/textfile"
    volumes:
      - /:/host:ro,rslave
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  # Per-container CPU / memory / restarts for the whole Docker host.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M

  # PostgreSQL metrics. POSTGRES_EXPORTER_DSN must point DIRECTLY at Postgres
  # (port 5432), NOT at pgBouncer (:6432) — transaction pooling breaks the
  # exporter's session-level queries. Example:
  #   POSTGRES_EXPORTER_DSN=postgresql://user:pass@host.docker.internal:5432/anak_dev?sslmode=disable
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${POSTGRES_EXPORTER_DSN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  # Log and trace storage are optional tiers: on a small box (4 CPU / 8G) they
  # cost ~470M of RSS and page cache that PostgreSQL needs far more than the
  # site needs 7-day log search. Metrics (prometheus/grafana/exporters) always
  # run; enable these with `make monitoring-up MONITORING_PROFILES="logs traces"`.
  loki:
    profiles: ["logs"]
    image: grafana/loki:3.3.2
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 280MiB
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 128M

  tempo:
    profiles: ["traces"]
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 400MiB
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  otel-collector:
    profiles: ["traces"]
    # 0.145.0 is the first release shipping the Sentry Exporter (alpha) used by
    # monitoring/otel/otel-collector.yml.
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yml"]
    environment:
      GOMEMLIMIT: 120MiB
      # Sentry Exporter target. The token is an Internal Integration token with
      # org:read + project:read. The "unset" fallback is deliberate: the exporter
      # requires a non-empty token at config validation, and an empty one would
      # crash-loop the collector and take Tempo down with it. With a bogus token
      # the Sentry branch only logs "Failed to pre-populate project cache" and
      # drops its spans, while the Tempo pipeline keeps running.
      SENTRY_ORG_SLUG: "${SENTRY_ORG_SLUG:-craazzzyyfoxx}"
      SENTRY_OTEL_PROJECT: "${SENTRY_OTEL_PROJECT:-owt-tournaments}"
      SENTRY_OTEL_AUTH_TOKEN: "${SENTRY_OTEL_AUTH_TOKEN:-unset}"
    volumes:
      - ./monitoring/otel/otel-collector.yml:/etc/otel-collector/config.yml:ro
    depends_on:
      - tempo
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 160M
        reservations:
          cpus: '0.05'
          memory: 64M

  promtail:
    profiles: ["logs"]
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/app:ro
    networks:
      - app-network
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001}"
      # Metrics are the only tier that always runs; logs.json/tracing.json are
      # empty unless the "logs"/"traces" profiles are enabled.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/infrastructure.json"
      TEMPO_URL: "${TEMPO_URL:-http://tempo:3200}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - app-network
    # Only prometheus: the loki/tempo datasources resolve lazily at query time,
    # so grafana must not depend on tiers that may be profiled off.
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
        reservations:
          cpus: '0.10'
          memory: 64M

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
  tempo_data:

networks:
  app-network:
    external: true
    name: owt_app-network
