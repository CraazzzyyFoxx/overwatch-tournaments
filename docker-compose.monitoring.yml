name: owt-monitoring

# ==============================================================================
# Monitoring stack for production, running on home (not on the production
# host): Prometheus + Alertmanager + Grafana + Loki + Tempo + blackbox.
#
# Telemetry arrives from the Alloy agent on Moscow (monitoring/alloy/moscow.alloy)
# through Traefik on home: ingest.owt.craazzzyyfoxx.me, allowlisted to Moscow's
# IP and basic-authed. Every port here binds 127.0.0.1 only; Traefik on the host
# is the only way in. Topology, secrets and troubleshooting: monitoring/README.md
#
# Images come through dockerhub.timeweb.cloud: Docker Hub's CDN does not answer
# from home or Moscow.
# ==============================================================================

x-logging: &log-rotate
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  prometheus:
    image: dockerhub.timeweb.cloud/prom/prometheus:v3.13.3
    logging: *log-rotate
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.home.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      # Alloy on Moscow and Tempo's metrics_generator both push here.
      - "--web.enable-remote-write-receiver"
    volumes:
      # Directory mounts, not file mounts, here and for alertmanager/blackbox:
      # git pull replaces a file (new inode), which a file bind mount never
      # sees, so /-/reload would keep re-reading the old config.
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 256M

  # xray SOCKS5 on proxy:1080, same image and config shape as the production
  # stack's `proxy`. Home cannot reach discord.com directly, so Alertmanager's
  # Discord notifications go through it. ./proxy/xray.json is gitignored: copy
  # the working one from the dev site (~/owt-dev/proxy/xray.json).
  proxy:
    image: dockerhub.timeweb.cloud/teddysun/xray:latest
    logging: *log-rotate
    restart: unless-stopped
    command: ["xray", "run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./proxy/xray.json:/etc/xray/config.json:ro
    healthcheck:
      test: ["CMD", "xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  alertmanager:
    # v0.28+ is REQUIRED: v0.27.0 parses `webhook_url_file` in discord_configs but
    # its receiver validation still demands `webhook_url`.
    image: dockerhub.timeweb.cloud/prom/alertmanager:v0.34.1
    logging: *log-rotate
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - ./monitoring/secrets:/run/secrets:ro
      - alertmanager_data:/alertmanager
    # Discord is not reachable from home directly; the discord receiver goes
    # through the `proxy` service (http_config.proxy_url in alertmanager.yml).
    depends_on:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # Probes production from outside, as any visitor would: the site's /health
  # and the SSH banner on :22 (monitoring/blackbox/blackbox.yml).
  blackbox-exporter:
    image: dockerhub.timeweb.cloud/prom/blackbox-exporter:v0.28.0
    logging: *log-rotate
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M

  loki:
    image: dockerhub.timeweb.cloud/grafana/loki:3.7.8
    logging: *log-rotate
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 280MiB
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:13101:3100"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 128M

  tempo:
    # Pinned to the 2.x line on purpose: Tempo 3.x drops the ingester/compactor
    # config blocks, requires vParquet4 blocks, and its metrics-generator reads
    # from Kafka instead of the distributor — a rewrite, not a bump.
    image: dockerhub.timeweb.cloud/grafana/tempo:2.10.8
    logging: *log-rotate
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 400MiB
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    # OTLP/HTTP only: Alloy on Moscow exports otlphttp through Traefik.
    ports:
      - "127.0.0.1:14318:4318"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  grafana:
    image: dockerhub.timeweb.cloud/grafana/grafana:13.2.2
    logging: *log-rotate
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://grafana.owt.craazzzyyfoxx.me}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/infrastructure.json"
      TEMPO_URL: "${TEMPO_URL:-http://tempo:3200}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:13002:3000"
    depends_on:
      - prometheus
    # v13 runs the app-platform apiserver and unified storage in-process; it sat
    # at 464 MiB of a 512M cap on Moscow.
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 128M

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
  tempo_data:
